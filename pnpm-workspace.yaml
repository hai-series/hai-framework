minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# 上游构建工具仍要求 4.x；4.0.3 tarball 已核对原 lockfile 的 SHA-512。
trustPolicyExclude:
  - chokidar@4.0.3
  # 1.19 删除 Mem0 3.3.1 所需 search；回退至最后受测的公开 API。
  - '@qdrant/js-client-rest@1.18.0'

nodeLinker: hoisted
shellEmulator: true

# =============================================================================
# hai Framework - pnpm Workspace 配置
# =============================================================================
# 定义 Monorepo 工作区结构和依赖版本统一管理
#
# @see https://pnpm.io/workspaces
# @see https://pnpm.io/catalogs
# =============================================================================

packages:
  # 核心包
  - 'packages/*'
  # 应用
  - 'apps/*'

overrides:
  # 上游仍锁定存在漏洞的间接依赖；只覆盖受影响范围，维持原有 API 与主版本。
  '@ai-sdk/provider-utils@>=4.0.0 <4.0.33': 4.0.57
  '@qdrant/js-client-rest>undici': 7.30.0
  '@types/node': ^26.6.5
  cookie@<0.7.0: 0.7.2
  # d3-shape@3（layerchart 图表依赖）需要 d3-path@3 的 `Path` 导出；强制统一到 3.1.0，
  # 消除 d3-shape@1.3.7 引入的 d3-path@1.0.9 嵌套冲突（否则应用打包报 MISSING_EXPORT "Path"）。
  d3-path: 3.1.0
  esbuild@<0.28.1: 0.28.2
  eslint-plugin-yml: 3.9.0

  katex@<0.18.2: 0.18.10
  sharp@<0.35.5: 0.35.5
  tinypool@<2.1.2: 2.2.0
  xcode>uuid: 11.1.1

allowBuilds:
  better-sqlite3: true
  core-js: false
  cpu-features: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  ssh2: true
  vue-demi: true
# =============================================================================
# 依赖版本统一管理 (Catalog)
# =============================================================================
# 使用 catalog: 协议引用统一版本，例如：
#   dependencies:
#     zod: "catalog:"
# =============================================================================
