minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - eslint-plugin-svelte@3.24.1
  - hono@4.13.17
  - nodemailer@10.4.0
  - parse5@8.1.1

trustPolicy: no-downgrade
# 上游构建工具仍要求 4.x；4.0.3 tarball 已核对原 lockfile 的 SHA-512。
trustPolicyExclude:
  - chokidar@4.0.3

nodeLinker: hoisted
shellEmulator: true

# =============================================================================
# hai Framework - pnpm Workspace 配置
# =============================================================================
# 定义 Monorepo 工作区结构和依赖版本统一管理
#
# @see https://pnpm.io/workspaces
# @see https://pnpm.io/catalogs
# =============================================================================

packages:
  # 核心包
  - 'packages/*'
  # 应用
  - 'apps/*'

overrides:
  # 上游仍锁定存在漏洞的间接依赖；只覆盖受影响范围，维持原有 API 与主版本。
  '@ai-sdk/provider-utils@>=4.0.0 <4.0.33': 4.0.57
  '@types/node': ^26.6.6
  body-parser@>=2 <2.4.0: 2.4.0
  cookie@<0.7.0: 0.7.2
  # d3-shape@3（layerchart 图表依赖）需要 d3-path@3 的 `Path` 导出；强制统一到 3.1.0，
  # 消除 d3-shape@1.3.7 引入的 d3-path@1.0.9 嵌套冲突（否则应用打包报 MISSING_EXPORT "Path"）。
  d3-path: 3.1.0
  dompurify@>=3 <3.4.17: 3.4.17
  esbuild@<0.28.1: 0.28.2
  eslint-plugin-yml: 3.9.0

  fast-uri@>=3 <3.1.9: 3.1.9
  follow-redirects@>=1.16.0 <1.16.2: 1.16.2

  glob@>=9 <=14.0.1: 14.0.4
  ip-address@<=10.7.3: 10.7.6
  katex@<0.18.2: 0.18.10
  minimatch@>=7 <11.0.1: 11.0.5
  # parser-stream 8.1 使用 parse5 8.1 的 tokenizer API，避免宽范围复用旧锁定版本。
  parse5@>=8 <8.1.0: 8.1.0
  qs@>=6.7 <6.16.1: 6.17.1
  # SvelteKit 3 对应的 runed 稳定版，统一 UI 依赖的宿主契约。
  runed@<0.38.0: 0.38.0
  sharp@<0.35.5: 0.35.5
  tinypool@<2.1.2: 2.2.0
  xcode>uuid: 11.1.1

patchedDependencies:
  daisyui@5.7.50: patches/daisyui-5.7.50.patch
  deepmerge@4.3.1: patches/deepmerge-4.3.1.patch

allowBuilds:
  core-js: false
  cpu-features: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  ssh2: true
  vue-demi: true
