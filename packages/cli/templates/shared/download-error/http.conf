map "$request_method:$args" $hai_signed_download {
  default 0;
  "~*^(GET|HEAD):(?:[^&]*&)*X-Amz-Signature=[^&]+(?:&|$)" 1;
}
map $http_accept_language $hai_download_language {
  default zh-CN;
  ~*^en en-US;
  ~*^ja ja-JP;
}
map $hai_download_language $hai_download_title {
  default "下载链接无法访问";
  en-US "Download link unavailable";
  ja-JP "ダウンロードリンクにアクセスできません";
}
map $hai_download_language $hai_download_instruction {
  default "请返回下载页面重新获取链接。若仍无法下载，请联系管理员。";
  en-US "Return to the download page to get a new link. If the download still fails, contact your administrator.";
  ja-JP "ダウンロードページに戻り、新しいリンクを取得してください。解決しない場合は管理者にお問い合わせください。";
}
