# =============================================================================
# 应用配置
# =============================================================================

# 用途：应用名称（默认 'hai Admin'）
name: ${HAI_CORE_NAME:framework-website}
# 用途：应用版本（默认 '0.1.0'）
version: ${HAI_CORE_VERSION:0.1.0}
# 用途：运行环境（默认 'development'）
env: ${HAI_CORE_ENV:development}

# 用途：日志配置（可选）
logging:
  # 用途：日志级别（默认 'info'）
  level: ${HAI_CORE_LOGGING_LEVEL:info}
  # 用途：日志格式：'json' 用于生产环境，'pretty' 用于开发环境（默认 'json'）
  format: ${HAI_CORE_LOGGING_FORMAT:pretty}
  # context:
  #   service: api
  # 用途：要脱敏的字段路径列表（如 ['password', 'token']，默认 []）
  redact:
    - password
    - token
    - secret

# 用途：默认语言（默认 'zh-CN'）
defaultLocale: ${HAI_CORE_DEFAULTLOCALE:zh-CN}
