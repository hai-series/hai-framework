# =============================================================================
# API Service - 数据库配置
# =============================================================================

# 说明：后端或功能类型，按枚举选择
# 取值：字符串；取值：sqlite | postgresql | mysql
type: ${HAI_DB_TYPE:sqlite}
# 说明：数据库：SQLite文件路径或:memory:；PostgreSQL必填名称；MySQL无URL时必填，URL模式从URL读取
# 取值：字符串；最小字符数 1
database: ${HAI_DB_DATABASE:./data/api-service.db}
# 说明：数据库主机地址（默认 localhost）
# 取值：字符串
host: ${HAI_DB_HOST:localhost}
# 说明：数据库端口 - PostgreSQL 默认 5432 - MySQL 默认 3306
# 取值：整数；>= 1；<= 65535
port: ${HAI_DB_PORT:5432}
# 说明：数据库用户名
# 取值：字符串
user: ${HAI_DB_USER:postgres}
# 说明：数据库密码
# 取值：字符串
password: ${HAI_DB_PASSWORD:}
# 说明：网络数据库URL；MySQL空串表示使用分字段，非空仅mysql://且拒绝query/fragment，优先于host/port/database/user/password
# 取值：字符串；格式 uri；取值：
url: ${HAI_DB_URL:}
# 说明：TLS：PostgreSQL使用其模式；MySQL仅false或严格对象，空对象默认校验证书链和DNS身份
# 取值：MySQL：false 或严格 TLS 对象（{} 默认校验证书链和 DNS 身份）；PostgreSQL：布尔值、require/prefer/allow/disable 或 TLS 对象
ssl: ${HAI_DB_SSL:false}
