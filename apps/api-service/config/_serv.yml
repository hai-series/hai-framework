# =============================================================================
# API Service - Serv / HTTP 入口配置
# =============================================================================

http:
  apiPrefix: /api/v1
  openapi:
    path: /openapi.json
  docs:
    path: /docs
  health:
    path: /health
    readyPath: /ready
  rpc: false

cors:
  origin: '*'
  nativeOrigins: http://localhost,https://tauri.localhost,tauri://localhost,capacitor://localhost
  credentials: true
  allowedHeaders:
    - Authorization
    - Content-Type
    - X-Client-Id
    - X-Encrypted
    - X-Hai-Locale
    - X-Request-Id
    - X-Requested-With
  exposedHeaders:
    - X-Encrypted
    - X-Request-Id

transport:
  keyExchangePath: /_hai/key-exchange
  excludePaths:
    - /health
    - /ready
    - /openapi.json
    - /docs
    - /_hai/scalar.js
  maxClients: 10000
