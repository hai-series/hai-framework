# =============================================================================
# API Service - Serv / HTTP 入口配置
# =============================================================================

# 说明：HTTP 服务监听地址与端口
# 取值：配置块（填写下方缩进字段）
server:
  # 说明：HTTP 监听主机名或 IP
  # 取值：字符串；最小字符数 1
  host: ${HAI_SERV_SERVER_HOST:127.0.0.1}
  # 说明：HTTP 监听端口
  # 取值：整数；>= 1；<= 65535
  port: ${HAI_SERV_SERVER_PORT:3000}

# 说明：HTTP 基础路径、请求体大小及访问配置
# 取值：配置块（填写下方缩进字段）
http:
  # 说明：可信代理 IP/CIDR；默认 auto 在普通宿主忽略转发头，仅受管私有 Compose 采用容器网段
  # 取值：字符串；列表（每项以 - 开头）；最多项数 1000；取值：auto
  trustedProxies: ${HAI_SERV_HTTP_TRUSTEDPROXIES:auto}
  # 说明：每次请求的路径/IP/时间策略；false 关闭，内联规则与独立 YAML 文件引用不能混用
  # 取值：false 或 配置块（填写下方缩进字段）
  access: ${HAI_SERV_HTTP_ACCESS:false}
  # 独立策略文件：access: { file: ./config/security/request-access.yml }
  # 固定窗口限流；启用时填写 windowMs（毫秒）和 maxRequests，并在生产连接共享 Redis。
  # 说明：HTTP 固定窗口限流；false 关闭，启用时由应用注入原子存储
  # 取值：false 或 配置块（填写下方缩进字段）
  rateLimit: ${HAI_SERV_HTTP_RATELIMIT:false}
  # rateLimit: { windowMs: 60000, maxRequests: 100 } # 说明：HTTP 固定窗口限流；false 关闭，启用时由应用注入原子存储；取值：false 或 配置块（填写下方缩进字段）
  # 说明：业务 HTTP API 的基础路径前缀
  # 取值：字符串
  apiPrefix: ${HAI_SERV_HTTP_APIPREFIX:/api/v1}
  # 说明：OpenAPI 端点开关或端点配置
  # 取值：true | false；false；配置块（填写下方缩进字段）；取值：false
  openapi:
    # 说明：当前 HTTP 功能的端点路径
    # 取值：字符串；以 / 开头的路径字符串
    path: ${HAI_SERV_HTTP_OPENAPI_PATH:/openapi.json}
  # 说明：HTTP API 文档功能开关或文档访问配置
  # 取值：true | false；false；配置块（填写下方缩进字段）；取值：false
  docs:
    # 说明：当前 HTTP 功能的端点路径
    # 取值：字符串；以 / 开头的路径字符串
    path: ${HAI_SERV_HTTP_DOCS_PATH:/docs}
  # 说明：HTTP 健康检查开关或检查配置
  # 取值：JSON 对象；false；配置块（填写下方缩进字段）；取值：false
  health:
    # 说明：当前 HTTP 功能的端点路径
    # 取值：字符串；以 / 开头的路径字符串
    path: ${HAI_SERV_HTTP_HEALTH_PATH:/health}
    # 说明：服务就绪检查的端点路径
    # 取值：字符串；以 / 开头的路径字符串
    readyPath: ${HAI_SERV_HTTP_HEALTH_READYPATH:/ready}
# A2A HTTP 默认关闭。启用时同时配置 _ai.yml 的公开 RPC URL 与 IAM API Key。
# 说明：发布 A2A HTTP 发现及 JSON-RPC；默认关闭
# 取值：false 或 配置块（填写下方缩进字段）
a2a: ${HAI_SERV_A2A:false}
# a2a: { cardPath: /.well-known/agent-card.json, rpcPath: /a2a } # 说明：发布 A2A HTTP 发现及 JSON-RPC；默认关闭；取值：false 或 配置块（填写下方缩进字段）
# 启用前配置 AI 音频模型，并在 IAM 授予使用者 ai:audio:use。
# 说明：实时语音 WebSocket HTTP 路径；默认关闭
# 取值：false 或 配置块（填写下方缩进字段）
audio: ${HAI_SERV_AUDIO:false}
# audio: { path: /voice } # 说明：实时语音 WebSocket HTTP 路径；默认关闭；取值：false 或 配置块（填写下方缩进字段）

# 说明：浏览器跨域访问策略；默认关闭
# 取值：false 或 配置块（填写下方缩进字段）
cors:
  # 说明：允许访问的完整来源；使用凭据时仅允许明确来源
  # 取值：字符串；列表（每项以 - 开头）
  origin: ${HAI_SERV_CORS_ORIGIN:http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5177,http://127.0.0.1:5177}
  # 说明：显式允许的原生 WebView 来源，使用逗号分隔
  # 取值：字符串
  nativeOrigins: ${HAI_SERV_CORS_NATIVEORIGINS:http://localhost,https://localhost,http://tauri.localhost,https://tauri.localhost,tauri://localhost,capacitor://localhost}
  # 说明：允许浏览器跨域携带 Cookie 等凭据，默认关闭
  # 取值：true | false
  credentials: ${HAI_SERV_CORS_CREDENTIALS:true}
  # 说明：浏览器预检获准发送的请求头
  # 取值：列表（每项以 - 开头）
  allowedHeaders:
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_0:Authorization}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_1:Content-Type}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_2:X-Client-Id}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_3:X-Encrypted}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_4:X-Hai-Locale}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_5:X-Request-Id}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_6:X-Requested-With}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_7:X-Hai-Transport}
    - ${HAI_SERV_CORS_ALLOWEDHEADERS_8:X-Hai-Reauthentication}
  # 说明：允许跨域页面通过 JavaScript 读取的响应头
  # 取值：列表（每项以 - 开头）
  exposedHeaders:
    - ${HAI_SERV_CORS_EXPOSEDHEADERS_0:X-Encrypted}
    - ${HAI_SERV_CORS_EXPOSEDHEADERS_1:X-Request-Id}
    - ${HAI_SERV_CORS_EXPOSEDHEADERS_2:X-Hai-Transport}

# 说明：传输加密开关或密钥协商配置
# 取值：false 或 配置块（填写下方缩进字段）
transport:
  # 双向业务明文 UTF-8 字节；默认 1 MiB，范围 1 KiB～64 MiB，密文容量自动推导。
  # 说明：普通业务双向明文上限；auto 为 1 MiB；大材料使用 routePlaintextBytes 单独声明
  # 取值：整数；>= 1024；<= 67108864；字符串；取值：auto
  maxPlaintextBytes: ${HAI_SERV_TRANSPORT_MAXPLAINTEXTBYTES:1048576}
  # 允许客户端时间领先 0～1800 秒，请求有效期为 1～3600 秒。两项均为整数秒。
  # 说明：允许客户端请求时间领先服务器的秒数
  # 取值：整数；>= 0；<= 1800
  maxFutureSkewSeconds: ${HAI_SERV_TRANSPORT_MAXFUTURESKEWSECONDS:30}
  # 说明：请求从签发起的有效秒数
  # 取值：整数；>= 1；<= 3600
  maxRequestAgeSeconds: ${HAI_SERV_TRANSPORT_MAXREQUESTAGESECONDS:300}
  # 说明：客户端与服务端约定的密钥交换端点
  # 取值：字符串；站点根绝对路径；使用非空普通路径段，无查询、片段或编码
  keyExchangePath: ${HAI_SERV_TRANSPORT_KEYEXCHANGEPATH:/api/v1/_hai/key-exchange}
  # 说明：不进入传输加密管道的路径
  # 取值：列表（每项以 - 开头）
  excludePaths:
    - ${HAI_SERV_TRANSPORT_EXCLUDEPATHS_0:/health}
    - ${HAI_SERV_TRANSPORT_EXCLUDEPATHS_1:/ready}
    - ${HAI_SERV_TRANSPORT_EXCLUDEPATHS_2:/openapi.json}
    - ${HAI_SERV_TRANSPORT_EXCLUDEPATHS_3:/docs}
    - ${HAI_SERV_TRANSPORT_EXCLUDEPATHS_4:/_hai/scalar.js}
