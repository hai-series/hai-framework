# 开发触达示例；生产环境改为 SMTP、短信或 API Provider。
# 用途：Provider 配置列表
providers:
  # 用途：Provider 唯一名称
  - name: email
    # 用途：后端或功能类型，按枚举选择
    type: ${HAI_REACH_PROVIDERS_0_TYPE:console}
  # 用途：Provider 唯一名称
  - name: sms
    # 用途：后端或功能类型，按枚举选择
    type: ${HAI_REACH_PROVIDERS_1_TYPE:console}
# 用途：模板配置（通过配置文件注册）
templates:
  # 用途：模板名称
  - name: otp_email
    # 用途：绑定的 Provider 名称
    provider: email
    # 用途：邮件主题模板
    subject: Verification code
    # 用途：正文模板
    body: 'Your verification code is {code}.'
  # 用途：模板名称
  - name: otp_sms
    # 用途：绑定的 Provider 名称
    provider: sms
    # 用途：正文模板
    body: 'Your verification code is {code}.'
  # 用途：模板名称
  - name: password_reset
    # 用途：绑定的 Provider 名称
    provider: email
    # 用途：邮件主题模板
    subject: Password reset
    # 用途：正文模板
    body: 'Reset your password: {resetUrl}. Expires at {expiresAt}.'
  # 用途：模板名称
  - name: password_reset_sms
    # 用途：绑定的 Provider 名称
    provider: sms
    # 用途：正文模板
    body: 'Reset your password: {resetUrl}. Expires at {expiresAt}.'
