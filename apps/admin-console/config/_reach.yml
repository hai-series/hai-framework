# =============================================================================
# Admin Console - Reach（触达服务）配置
# =============================================================================

# Provider 配置
# 用途：Provider 配置列表
providers:
  # 开发环境使用 console provider（输出到日志）
  # 用途：Provider 唯一名称
  - name: email
    # 用途：后端或功能类型，按枚举选择
    type: ${HAI_REACH_PROVIDERS_0_TYPE:console}
  # 用途：Provider 唯一名称
  - name: sms
    # 用途：后端或功能类型，按枚举选择
    type: ${HAI_REACH_PROVIDERS_1_TYPE:console}

# 模板配置
# 用途：模板配置（通过配置文件注册）
templates:
  # 密码重置邮件
  # 用途：模板名称
  - name: password_reset
    # 用途：绑定的 Provider 名称
    provider: email
    # 用途：邮件主题模板
    subject: Password Reset Request
    # 用途：正文模板
    body: 'Your password reset token is: {token}. It will expire at {expiresAt}.'
  # 邮箱 OTP 验证码
  # 用途：模板名称
  - name: otp_email
    # 用途：绑定的 Provider 名称
    provider: email
    # 用途：邮件主题模板
    subject: 'Verification Code: {code}'
    # 用途：正文模板
    body: 'Your verification code is: {code}'
  # 短信 OTP 验证码
  # 用途：模板名称
  - name: otp_sms
    # 用途：绑定的 Provider 名称
    provider: sms
    # 用途：正文模板
    body: 'Your verification code is: {code}'
