# =============================================================================
# 部署配置 (@h-ai/deploy) — docker-ssh
# =============================================================================
# 将应用容器化后经 SSH 部署到自有 Linux 主机（远程需 SSH + docker/podman + compose）。
# 凭证经 ~/.hai/credentials.yml 注入，引用格式 ${VAR}。
#
# 运行 `hai deploy` 读取本文件并输出访问地址。启用的服务（_db.yml/_cache.yml/
# _storage.yml 等）会按其实际后端类型自动生成 compose sidecar。

provider:
  type: ${HAI_DEPLOY_PROVIDER_TYPE:docker-ssh}
  ssh:
    host: ${HAI_DEPLOY_PROVIDER_SSH_HOST} # 主机 IP 或 ~/.ssh/config 别名
    port: ${HAI_DEPLOY_PROVIDER_SSH_PORT:22}
    username: ${HAI_DEPLOY_PROVIDER_SSH_USERNAME:deploy}
    identityFile: ${HAI_DEPLOY_PROVIDER_SSH_IDENTITYFILE} # 私钥文件路径，省略则用 ssh-agent
  remote:
    baseDir: ${HAI_DEPLOY_PROVIDER_REMOTE_BASEDIR:/opt/hai/apps} # 远程部署根目录
    runtime: ${HAI_DEPLOY_PROVIDER_REMOTE_RUNTIME:auto} # 远程运行时；auto 优先 podman，其次 docker
  expose:
    type: ${HAI_DEPLOY_PROVIDER_EXPOSE_TYPE:port}
    containerPort: ${HAI_DEPLOY_PROVIDER_EXPOSE_CONTAINERPORT:3000} # 容器内端口（adapter-node 默认 3000）
    hostPort: ${HAI_DEPLOY_PROVIDER_EXPOSE_HOSTPORT:18080} # 宿主机端口 → 访问地址 http://<host>:18080

# Compose 参数；镜像构建设置位于 hai.build.json。
container:
  s3Engine: ${HAI_DEPLOY_CONTAINER_S3ENGINE:rustfs}

services: {}

# 也可切换为 Vercel：
# provider:
#   type: vercel
#   token: ${HAI_DEPLOY_PROVIDER_TOKEN}
