# 说明：HTTP 基础路径、请求体大小及访问配置
# 取值：配置块（填写下方缩进字段）
http:
  # auto 仅在受管私有容器代理中采用容器网段；自建代理填写 IP/CIDR。
  # 说明：可信代理 IP/CIDR；默认 auto 在普通宿主忽略转发头，仅受管私有 Compose 采用容器网段
  # 取值：字符串；列表（每项以 - 开头）；最多项数 1000；取值：auto
  trustedProxies: ${HAI_KIT_HTTP_TRUSTEDPROXIES:auto}
  # 说明：每次请求的路径/IP/时间策略；false 关闭，内联规则与独立 YAML 文件引用不能混用
  # 取值：false 或 配置块（填写下方缩进字段）
  access: ${HAI_KIT_HTTP_ACCESS:false}
  # 独立策略文件：access: { file: ./config/security/request-access.yml }
  # 说明：HTTP 固定窗口限流；false 关闭，启用时由应用注入原子存储
  # 取值：false 或 配置块（填写下方缩进字段）
  rateLimit:
    # 说明：固定窗口时长，单位为毫秒，从首次成功提交计数起算
    # 取值：整数；>= 1；<= 2147483647
    windowMs: ${HAI_KIT_HTTP_RATELIMIT_WINDOWMS:60000}
    # 说明：同一主体在窗口内允许的请求数
    # 取值：整数；>= 1
    maxRequests: ${HAI_KIT_HTTP_RATELIMIT_MAXREQUESTS:100}
# 说明：HTTP 服务监听地址与端口
# 取值：配置块（填写下方缩进字段）
server:
  # 说明：HTTP 监听主机名或 IP
  # 取值：字符串；最小字符数 1
  host: ${HAI_KIT_SERVER_HOST:127.0.0.1}
  # 说明：HTTP 监听端口
  # 取值：整数；>= 1；<= 65535
  port: ${HAI_KIT_SERVER_PORT:3000}

# 说明：传输加密开关或密钥协商配置
# 取值：false 或 配置块（填写下方缩进字段）
transport:
  # 说明：普通业务双向明文上限；auto 为 1 MiB；大材料使用 routePlaintextBytes 单独声明
  # 取值：整数；>= 1024；<= 67108864；字符串；取值：auto
  maxPlaintextBytes: ${HAI_KIT_TRANSPORT_MAXPLAINTEXTBYTES:auto}
  # 允许客户端时间领先 0～1800 秒，请求有效期为 1～3600 秒。两项均为整数秒。
  # 说明：允许客户端请求时间领先服务器的秒数
  # 取值：整数；>= 0；<= 1800
  maxFutureSkewSeconds: ${HAI_KIT_TRANSPORT_MAXFUTURESKEWSECONDS:30}
  # 说明：请求从签发起的有效秒数
  # 取值：整数；>= 1；<= 3600
  maxRequestAgeSeconds: ${HAI_KIT_TRANSPORT_MAXREQUESTAGESECONDS:300}
  # 说明：客户端与服务端约定的密钥交换端点
  # 取值：字符串；站点根绝对路径；使用非空普通路径段，无查询、片段或编码
  keyExchangePath: ${HAI_KIT_TRANSPORT_KEYEXCHANGEPATH:/api/v1/_hai/key-exchange}
  # 说明：不进入传输加密管道的路径
  # 取值：列表（每项以 - 开头）
  excludePaths:
    - ${HAI_KIT_TRANSPORT_EXCLUDEPATHS_0:/api/storage}
    - ${HAI_KIT_TRANSPORT_EXCLUDEPATHS_1:/api/public}
    - ${HAI_KIT_TRANSPORT_EXCLUDEPATHS_2:/api/auth/profile/avatar}
