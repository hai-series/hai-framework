server:
  host: ${HAI_KIT_SERVER_HOST:127.0.0.1}
  port: ${HAI_KIT_SERVER_PORT:3000}

transport:
  # 双向业务明文 UTF-8 字节；默认 1 MiB，范围 1 KiB～64 MiB，密文容量自动推导。
  maxPlaintextBytes: ${HAI_KIT_TRANSPORT_MAXPLAINTEXTBYTES:1048576}
  keyExchangePath: ${HAI_KIT_TRANSPORT_KEYEXCHANGEPATH:/api/_hai/key-exchange}
  excludePaths:
    - ${HAI_KIT_TRANSPORT_EXCLUDEPATHS_0:/api/storage}
    - ${HAI_KIT_TRANSPORT_EXCLUDEPATHS_1:/api/public}
    - ${HAI_KIT_TRANSPORT_EXCLUDEPATHS_2:/api/auth/profile/avatar}
