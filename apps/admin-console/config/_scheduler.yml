# 自动审计备份启用时装配；执行状态与去重记录复用共享数据库。
# 说明：必须使用共享数据库保存执行状态；false 不再允许，需要先初始化
# 取值：true；取值：true
enableDb: true
# 说明：调度检查间隔，单位毫秒（默认 1000，即每秒检查一次）
# 取值：整数；>= 100
tickInterval: ${HAI_SCHEDULER_TICKINTERVAL:1000}
# 说明：执行租约毫秒数（默认 300000，范围 1000–86400000），在途每三分之一周期续期。
# 取值：整数；>= 1000；<= 86400000
leaseMs: ${HAI_SCHEDULER_LEASEMS:300000}
