# =============================================================================
# Admin Console - 应用配置
# =============================================================================
#
# 此文件定义应用级配置，使用 core.config 加载。
# 每个叶子项都可由约定式 HAI 环境变量覆盖，敏感值不要写入文件。
# =============================================================================

# 应用信息
# 用途：应用名称（默认 'hai Admin'）
name: ${HAI_CORE_NAME:hai Admin Console}
# 用途：应用版本（默认 '0.1.0'）
version: ${HAI_CORE_VERSION:0.1.0}
# 用途：运行环境（默认 'development'）
env: ${HAI_CORE_ENV:development}

# 语言设置
# 用途：默认语言（默认 'zh-CN'）
defaultLocale: ${HAI_CORE_DEFAULTLOCALE:zh-CN}
