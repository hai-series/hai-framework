# =============================================================================
# Admin Console - 应用配置
# =============================================================================
#
# 此文件定义应用级配置，使用 core.config 加载。
# 每个叶子项都可由约定式 HAI 环境变量覆盖，敏感值不要写入文件。
# =============================================================================

# 应用信息
name: hai Admin Console
version: 0.1.0
env: development
debug: true

# 语言设置
defaultLocale: zh-CN
supportedLocales:
  - zh-CN
  - en-US

# 功能开关
features:
  registration: true
  apiAccess: true
  aiEnabled: true
  mcpEnabled: false
  fileUpload: true
