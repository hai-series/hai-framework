# =============================================================================
# Admin Console - 存储配置
# =============================================================================

# 存储类型: local | s3
# 说明：存储类型
# 取值：字符串；取值：s3 | local
type: ${HAI_STORAGE_TYPE:local}

# 本地存储配置
# 说明：根目录路径
# 取值：字符串；最小字符数 1
root: ${HAI_STORAGE_ROOT:./data/uploads}
# 说明：存储桶名称
# 取值：字符串；最小字符数 1
bucket: ${HAI_STORAGE_BUCKET:}
# 说明：区域
# 取值：字符串；最小字符数 1
region: ${HAI_STORAGE_REGION:us-east-1}
# 说明：Access Key ID
# 取值：字符串；最小字符数 1
accessKeyId: ${HAI_STORAGE_ACCESSKEYID:}
# 说明：Secret Access Key
# 取值：字符串；最小字符数 1
secretAccessKey: ${HAI_STORAGE_SECRETACCESSKEY:}

# S3 配置（当 type 为 s3 时使用）
# type: s3 # 说明：存储类型；取值：字符串；取值：s3 | local
# bucket: my-bucket # 说明：存储桶名称；取值：字符串；最小字符数 1
# region: us-east-1 # 说明：区域；取值：字符串；最小字符数 1
# accessKeyId: '' # 说明：Access Key ID；取值：字符串；最小字符数 1
# secretAccessKey: '' # 说明：Secret Access Key；取值：字符串；最小字符数 1
# endpoint: '' # 说明：自定义端点（用于 MinIO、RustFS、阿里云 OSS 等）；取值：字符串；格式 uri
# forcePathStyle: false # 说明：强制使用路径风格 URL（某些 S3 兼容服务需要）；取值：true | false

# S3 兼容端点；生产默认连接 Compose storage 服务。
# 说明：自定义端点（用于 MinIO、RustFS、阿里云 OSS 等）
# 取值：字符串；格式 uri
endpoint: ${HAI_STORAGE_ENDPOINT:https://s3.amazonaws.com}
# 私有预签名的浏览器地址；可含 /delivery/files 等代理目录，不含桶名、凭据或查询；网关去前缀后直达 S3。
# publicEndpoint: ${HAI_STORAGE_PUBLICENDPOINT:https://files.example.com} # 说明：浏览器预签名端点，可含代理目录（如 /delivery/files），不含桶名、凭据或查询；代理须去除目录并保留 Host。；取值：字符串；格式 uri
# 说明：强制使用路径风格 URL（某些 S3 兼容服务需要）
# 取值：true | false
forcePathStyle: ${HAI_STORAGE_FORCEPATHSTYLE:false}
# 可选自动建桶；生产自建 S3 由环境启用，需具备建桶权限。
# 说明：初始化时检查并创建缺失的桶；默认关闭，启用后凭据须有建桶权限。
# 取值：true | false
createBucket: ${HAI_STORAGE_CREATEBUCKET:false}
