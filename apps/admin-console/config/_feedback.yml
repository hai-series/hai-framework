# 反馈材料与通知独立记录状态，生产使用私有 S3 与 SMTP email Provider。
# 说明：反馈所属应用标识；应与浏览器及 API 入口配置一致。
# 取值：字符串；最小字符数 1；最大字符数 128
appId: admin-console
# appVersion/buildId/commit 由本次构建元数据注入，不使用静态示例值。
# 说明：disabled 不通知，console 默认仅输出元数据，reach 使用已有通知通道。
# 取值：字符串；取值：disabled | console | reach
notificationMode: ${HAI_FEEDBACK_NOTIFICATIONMODE:console}
# 说明：console 通知内容；metadata 只输出定位和采集状态，summary 显式加入通用脱敏摘要。
# 取值：字符串；取值：metadata | summary
consoleContent: ${HAI_FEEDBACK_CONSOLECONTENT:metadata}
# 说明：未压缩导出总预算；客户端、附件总量和传输预算由此派生。
# 取值：整数；>= 4194304；<= 41943040
maxTotalBytes: ${HAI_FEEDBACK_MAXTOTALBYTES:33554432}
# 说明：Reach 接收方，由实际 Provider 校验邮箱、手机号或业务目的地。
# 取值：列表（每项以 - 开头）；最多项数 20
recipients: []
# Reach 模式取消下面接收方配置的注释，并设置真实通知通道。
# recipients: # 说明：Reach 接收方，由实际 Provider 校验邮箱、手机号或业务目的地。；取值：列表（每项以 - 开头）；最多项数 20
#   - ${HAI_FEEDBACK_RECIPIENTS_0:}
# 说明：已初始化 Reach Provider 的唯一名称，不限制为邮件。
# 取值：字符串；最小字符数 1
notificationProvider: email
# 说明：管理员通知中的反馈管理页面地址。
# 取值：字符串；格式 uri
adminUrl: ${HAI_FEEDBACK_ADMINURL:http://localhost:5173/admin/feedback}
# 说明：补充材料收集超时，单位毫秒；超时后冻结为完整或部分材料。
# 取值：整数；>= 0；<= 300000
collectionTimeoutMs: ${HAI_FEEDBACK_COLLECTIONTIMEOUTMS:60000}
# 说明：业务 collectEvidence 异步回调的等待上限，单位毫秒；超时后重试采集任务。
# 取值：整数；>= 1；<= 300000
businessCollectionTimeoutMs: ${HAI_FEEDBACK_BUSINESSCOLLECTIONTIMEOUTMS:30000}
# 可信服务端 Webhook；空地址禁用。密钥仅放 .env.local 或部署私有环境。
# 说明：反馈采集结束后的 Webhook 地址；空字符串禁用，只允许可信 HTTP(S) 地址且不跟随重定向。
# 取值：字符串；最大字符数 2048
webhookUrl: ${HAI_FEEDBACK_WEBHOOKURL:}
# 说明：Webhook HMAC-SHA256 签名密钥；空字符串不签名，仅服务端私有环境配置。
# 取值：字符串；最大字符数 4096
webhookSecret: ${HAI_FEEDBACK_WEBHOOKSECRET:}
# 说明：单次 Webhook 请求超时，单位毫秒；非 2xx 或超时均进入持久重试。
# 取值：整数；>= 1；<= 60000
webhookTimeoutMs: ${HAI_FEEDBACK_WEBHOOKTIMEOUTMS:10000}
# 说明：持久任务扫描间隔，单位毫秒；零值由宿主手动运行任务。
# 取值：整数；>= 0；<= 60000
workerIntervalMs: ${HAI_FEEDBACK_WORKERINTERVALMS:1000}
# 说明：允许采集的服务端环境变量名；凭据类名称仍按敏感信息策略排除。
# 取值：列表（每项以 - 开头）；最多项数 100
envAllowlist: [ NODE_ENV, TZ ]

# 说明：单个用户按数据库 UTC 日累计受理上限；幂等重试不重复计数。
# 取值：整数；>= 1；<= 10000
maxReportsPerUserDay: ${HAI_FEEDBACK_MAXREPORTSPERUSERDAY:20}
# 说明：单个用户每日预留存储字节（报告与最多历史导出）；默认 2 GiB。
# 取值：整数；>= 4194304；<= 1099511627776
maxBytesPerUserDay: ${HAI_FEEDBACK_MAXBYTESPERUSERDAY:2147483648}
# 说明：应用内单个 scope 的持久材料预留容量；到期清理成功后释放，默认 10 GiB。
# 取值：整数；>= 4194304；<= 1099511627776
maxStoredBytesPerScope: ${HAI_FEEDBACK_MAXSTOREDBYTESPERSCOPE:10737418240}
# 说明：单份报告最多历史导出数；已有有效快照复用，不重复计数。
# 取值：整数；>= 1；<= 20
maxExportsPerReport: ${HAI_FEEDBACK_MAXEXPORTSPERREPORT:5}
# 说明：已完成导出的有效小时数；过期禁止下载，后台删除对象，默认 24 小时。
# 取值：整数；>= 1；<= 720
exportRetentionHours: ${HAI_FEEDBACK_EXPORTRETENTIONHOURS:24}
