# 说明：同一数据库中区分应用的稳定标识。
# 取值：字符串；最小字符数 1；最大字符数 128
appId: admin-console

# 单次发送容量，按 Base64 编码前的原始字节计算。
# limits: # 说明：首帖、回复和补充请求的发送上限；取值：配置块（填写下方缩进字段）
#   maxBodyLength: 5000 # 说明：每次发送正文的 UTF-16 代码单元上限；取值：整数；>= 1；<= 20000
#   maxFiles: 5 # 说明：每次发送时手动附件的数量上限；取值：整数；>= 1；<= 20
#   maxFileBytes: 5242880 # 说明：单个文件原始字节的上限；取值：整数；>= 1；<= 10485760
#   maxTotalFileBytes: 10485760 # 说明：单次发送的手动附件与首帖现场合计原始字节上限；取值：整数；>= 1；<= 25165824

# 首帖现场采集容量。
# capture: # 说明：首帖现场的采集上限；取值：配置块（填写下方缩进字段）
#   windowSeconds: 300 # 说明：日志与操作回放的回看秒数；取值：整数；>= 1；<= 1800
#   maxLogEntries: 1000 # 说明：每份浏览器或服务端日志的条数上限；取值：整数；>= 1；<= 5000
#   maxLogBytes: 524288 # 说明：每份日志的字节上限；取值：整数；>= 1；<= 2097152
#   maxReplayBytes: 2097152 # 说明：页面回放文件的字节上限；取值：整数；>= 1；<= 8388608
#   maxReplayEvents: 2000 # 说明：单份页面回放的事件数量上限；取值：整数；>= 1；<= 10000
#   maxRecordingSeconds: 60 # 说明：浏览器录屏的最长秒数；取值：整数；>= 1；<= 300

# 最近一次活动起保留的天数，0 为长期保留。
# retention: # 说明：反馈、消息和附件的保留设置；取值：配置块（填写下方缩进字段）
#   days: 0 # 说明：从最近一次活动起算的保留天数，0 表示长期保留；取值：整数；>= 0；<= 3650
