# AI Playground 完整示例配置。
# 模型、端点和行为参数提供 YAML 默认值；约定环境变量可覆盖任意叶子项。
# 说明：LLM 配置（可选，所有字段有默认值）
# 取值：配置块（填写下方缩进字段）
llm:
  # 可选 ACP 模型；取消注释前按实际 Responses 服务填写，不能沿用仅支持 Chat 的端点。
  # 配置资源同 ID 优先且只读；数据库模型使用 ai.llm.models 管理。
  # models: # 说明：多模型配置列表（各字段可选，未指定时回退到全局默认值）；取值：列表（每项以 - 开头）
  #   - id: coding # 说明：模型唯一标识（用于 ModelResolver 解析）；取值：字符串
  #     model: ${HAI_AI_LLM_MODELS_0_MODEL:your-coding-model} # 说明：模型名称（传给 API 的实际模型名）；取值：字符串
  #     protocol: responses # 说明：API 协议（可选，未指定时回退全局 `protocol`，再回退 `chat`；决定走 Chat Completions / Responses / Anthropic）；取值：字符串；取值：chat | responses | anthropic
  #     baseUrl: ${HAI_AI_LLM_MODELS_0_BASEURL:https://your-responses-service.example/v1} # 说明：Base URL 覆盖（可选）；取值：字符串；格式 uri
  #     apiKey: ${HAI_AI_LLM_MODELS_0_APIKEY:} # 说明：API Key 覆盖（可选，未提供时使用全局配置）；取值：字符串或空值
  # 能力元数据可在模型项 capabilities 中填写，必须以供应商实际能力为准。
  # DeepSeek Harness 还要求 contextWindow/maxOutputTokens/inputModalities/outputModalities/
  # toolCalling/reasoning；支持推理时需列出 efforts，详见 hai-ai/acp.md。
  # 说明：默认服务密钥；模型项可单独覆盖。未填写时读取 HAI_AI_LLM_APIKEY 或对应供应商密钥变量，真实值只放服务端。
  # 取值：字符串或空值
  apiKey: ${HAI_AI_LLM_APIKEY:}
  # 说明：默认模型服务地址；使用代理时填写，模型项可覆盖。未填写时按协议读取环境地址或使用供应商默认地址。
  # 取值：字符串；格式 uri
  baseUrl: ${HAI_AI_LLM_BASEURL:https://api.xiaomimimo.com/v1}
  # 说明：默认模型名称（默认 `'gpt-4o-mini'`）
  # 取值：字符串
  model: ${HAI_AI_LLM_MODEL:mimo-v2.5}
  # 说明：默认请求格式：chat 为 Chat Completions，responses 为 OpenAI Responses，anthropic 为 Anthropic Messages；模型项可覆盖。
  # 取值：字符串；取值：chat | responses | anthropic
  protocol: ${HAI_AI_LLM_PROTOCOL:chat}
  # 说明：回答的随机程度，0–2，默认 0.7；较低通常更稳定，模型项可覆盖，部分模型不支持自定义。
  # 取值：数字；>= 0；<= 2
  temperature: ${HAI_AI_LLM_TEMPERATURE:0.7}
  # 说明：单次回答最多生成多少 Token，默认 4096；模型项可覆盖，需符合供应商限制。
  # 取值：数字；> 0
  maxTokens: ${HAI_AI_LLM_MAXTOKENS:4096}
  # 说明：一次模型请求最多等待多少毫秒，默认 60000；模型项可覆盖。
  # 取值：数字；> 0
  timeout: ${HAI_AI_LLM_TIMEOUT:120000}

# 说明：Audio 配置（语音识别 / 语音合成）
# 取值：配置块（填写下方缩进字段）
audio:
  # MiMo 的 LLM/ASR/TTS 共用同一密钥；跨供应商时不要启用继承。
  # 说明：是否允许未单独配置密钥的语音模型继承 LLM 全局密钥；跨供应商部署应保持关闭。
  # 取值：true | false
  inheritLlmApiKey: ${HAI_AI_AUDIO_INHERITLLMAPIKEY:true}
  # 说明：注册的语音模型列表
  # 取值：列表（每项以 - 开头）
  models:
    # 说明：模型唯一标识（用于场景解析与请求显式指定）
    # 取值：字符串
    - id: asr
      # 说明：所属语音平台
      # 取值：字符串；取值：openai | mimo | qwen | doubao | whisper | indextts
      provider: ${HAI_AI_AUDIO_MODELS_0_PROVIDER:mimo}
      # 说明：厂商模型名（传给厂商 API 的实际模型名）
      # 取值：字符串
      model: ${HAI_AI_AUDIO_MODELS_0_MODEL:mimo-v2.5-asr}
      # 说明：模型允许执行的操作；解析模型时会在调用厂商前校验
      # 取值：列表（每项以 - 开头）；最少项数 1
      operations: [ transcribe ]
      # 说明：HTTP / WebSocket 端点覆盖（`whisper` / `indextts` 无默认端点，必须显式配置）
      # 取值：字符串
      baseUrl: ${HAI_AI_AUDIO_MODELS_0_BASEURL:https://api.xiaomimimo.com/v1}
      # 说明：请求超时（毫秒，默认 60000）
      # 取值：数字；> 0
      timeout: ${HAI_AI_AUDIO_MODELS_0_TIMEOUT:120000}
    # 说明：模型唯一标识（用于场景解析与请求显式指定）
    # 取值：字符串
    - id: tts
      # 说明：所属语音平台
      # 取值：字符串；取值：openai | mimo | qwen | doubao | whisper | indextts
      provider: ${HAI_AI_AUDIO_MODELS_1_PROVIDER:mimo}
      # 说明：厂商模型名（传给厂商 API 的实际模型名）
      # 取值：字符串
      model: ${HAI_AI_AUDIO_MODELS_1_MODEL:mimo-v2.5-tts}
      # 说明：模型允许执行的操作；解析模型时会在调用厂商前校验
      # 取值：列表（每项以 - 开头）；最少项数 1
      operations: [ synthesize ]
      # 说明：HTTP / WebSocket 端点覆盖（`whisper` / `indextts` 无默认端点，必须显式配置）
      # 取值：字符串
      baseUrl: ${HAI_AI_AUDIO_MODELS_1_BASEURL:https://api.xiaomimimo.com/v1}
      # 说明：请求超时（毫秒，默认 60000）
      # 取值：数字；> 0
      timeout: ${HAI_AI_AUDIO_MODELS_1_TIMEOUT:120000}
  # 说明：默认识别模型 ID（`ai.audio.transcribe*` 未指定 model 时使用）
  # 取值：字符串
  transcribeModel: ${HAI_AI_AUDIO_TRANSCRIBEMODEL:asr}
  # 说明：默认合成模型 ID（`ai.audio.synthesize*` 未指定 model 时使用）
  # 取值：字符串
  synthesizeModel: ${HAI_AI_AUDIO_SYNTHESIZEMODEL:tts}

# 说明：Image 配置（文生图）
# 取值：配置块（填写下方缩进字段）
image:
  # 说明：单张图片或参考图的字节上限，默认 20 MiB；JSON 上限为 max(64 KiB, 两倍图片上限)。
  # 取值：整数；<= 104857600；> 0
  maxImageBytes: ${HAI_AI_IMAGE_MAXIMAGEBYTES:20971520}
  # 说明：单次生成/参考图数量上限，默认 4，最大 16；临时 URL 串行下载。
  # 取值：整数；<= 16；> 0
  maxImages: ${HAI_AI_IMAGE_MAXIMAGES:4}
  # 说明：注册的文生图模型
  # 取值：列表（每项以 - 开头）
  models:
    # 默认示例使用 Pollinations。402 表示账户余额或该 Key 的预算耗尽；
    # 可在 https://enter.pollinations.ai/ 创建/调整 Key 与预算。
    # 说明：模型唯一标识（供请求选择）
    # 取值：字符串
    - id: image
      # 说明：所属文生图平台
      # 取值：字符串；取值：openai | google | qwen | seedream | pollinations
      provider: ${HAI_AI_IMAGE_MODELS_0_PROVIDER:pollinations}
      # 说明：厂商模型名
      # 取值：字符串
      model: ${HAI_AI_IMAGE_MODELS_0_MODEL:zimage}
      # 数组项通常用索引生成变量名；这里显式指定更稳定的厂商密钥名。
      # 说明：API Key 覆盖；未提供时回退厂商环境变量
      # 取值：字符串或空值
      apiKey: ${HAI_AI_IMAGE_POLLINATIONS_APIKEY:}
      # 说明：整次图片生成与下载超时（毫秒，1–2147483647，默认 120000）
      # 取值：整数；<= 2147483647；> 0
      timeout: ${HAI_AI_IMAGE_MODELS_0_TIMEOUT:120000}
    # 切换厂商时，取消对应块的注释，并把 generateModel 改为相应 id。
    # - id: openai-image # 说明：模型唯一标识（供请求选择）；取值：字符串
    #   provider: openai # 说明：所属文生图平台；取值：字符串；取值：openai | google | qwen | seedream | pollinations
    #   model: gpt-image-2 # 说明：厂商模型名；取值：字符串
    #   apiKey: ${OPENAI_API_KEY:} # 说明：API Key 覆盖；未提供时回退厂商环境变量；取值：字符串或空值
    # - id: google-image # 说明：模型唯一标识（供请求选择）；取值：字符串
    #   provider: google # 说明：所属文生图平台；取值：字符串；取值：openai | google | qwen | seedream | pollinations
    #   model: gemini-3.1-flash-image # 说明：厂商模型名；取值：字符串
    #   apiKey: ${GEMINI_API_KEY:} # 说明：API Key 覆盖；未提供时回退厂商环境变量；取值：字符串或空值
    # - id: qwen-image # 说明：模型唯一标识（供请求选择）；取值：字符串
    #   provider: qwen # 说明：所属文生图平台；取值：字符串；取值：openai | google | qwen | seedream | pollinations
    #   model: qwen-image-3.0-pro # 说明：厂商模型名；取值：字符串
    #   apiKey: ${DASHSCOPE_API_KEY:} # 说明：API Key 覆盖；未提供时回退厂商环境变量；取值：字符串或空值
    #   workspaceId: ${DASHSCOPE_WORKSPACE_ID:} # 说明：阿里云百炼业务空间 ID（可选）；取值：字符串
    # - id: seedream-image # 说明：模型唯一标识（供请求选择）；取值：字符串
    #   provider: seedream # 说明：所属文生图平台；取值：字符串；取值：openai | google | qwen | seedream | pollinations
    #   model: doubao-seedream-5-0-lite # 说明：厂商模型名；取值：字符串
    #   apiKey: ${ARK_API_KEY:} # 说明：API Key 覆盖；未提供时回退厂商环境变量；取值：字符串或空值
  # 说明：默认文生图模型 ID
  # 取值：字符串
  generateModel: ${HAI_AI_IMAGE_GENERATEMODEL:image}

# 说明：Memory 配置
# 取值：配置块（填写下方缩进字段）
memory:
  # 说明：记忆后端：native 使用框架原生存储与批量合并；mem0 将框架提取结果以 Mem0 数据格式写入 Qdrant
  # 取值：字符串；取值：native | mem0
  provider: ${HAI_AI_MEMORY_PROVIDER:native}
  # 说明：是否启用向量检索（默认 true，关闭则仅使用关键词匹配）
  # 取值：true | false
  embeddingEnabled: ${HAI_AI_MEMORY_EMBEDDINGENABLED:false}
  # 说明：检索时默认返回数量（默认 10）
  # 取值：整数；> 0
  defaultTopK: ${HAI_AI_MEMORY_DEFAULTTOPK:8}

# ACP 接入示例：配置与数据库清单合并，同 ID 配置优先且只读。
# 使用前初始化共享 RelDB/VecDB，再初始化 AI；这些注释不会自动启动智能体。
# 接入/容器/worktree 示例见 packages/cli/templates/skills/hai-ai/acp.md；
# 模型、MCP、检索源清单管理见同目录 resources.md（路径相对于仓库根）。
# acp: # 说明：ACP 会话与执行限制（仅 Node 服务端）。；取值：配置块（填写下方缩进字段）
#   requestTimeout: 30000 # 说明：握手和控制请求超时，毫秒。；取值：整数；> 0
#   promptTimeout: 600000 # 说明：单轮任务超时，毫秒。；取值：整数；> 0
#   agents: # 说明：配置文件定义的只读智能体，与数据库记录按 ID 合并。；取值：列表（每项以 - 开头）
#     - id: coder # 说明：清单中的唯一 ID；同时用于受管理目录名。；取值：字符串；正则 ^[a-z0-9][\w-]{0,95}$
#       name: Codex # 说明：智能体的可读名称。；取值：字符串；最小字符数 1
#       mode: embedded # 说明：接入模式：自定义远程服务、本机内嵌进程或托管容器。；取值：字符串；取值：custom-service | embedded | builtin-service
#       adapter: codex # 说明：原生配置适配器名称，默认 generic。；取值：字符串；最小字符数 1
#       modelIds: [coding] # 说明：绑定 Hai LLM 模型 ID；默认空数组。；取值：列表（每项以 - 开头）
#   workspaces: # 说明：配置文件定义的只读工作区，与数据库记录按 ID 合并。；取值：列表（每项以 - 开头）
#     - id: project # 说明：清单中的唯一 ID；同时用于受管理目录名。；取值：字符串；正则 ^[a-z0-9][\w-]{0,95}$
#       storage: # 说明：持久存储位置；directory 供本机，volume 供托管容器。；取值：配置块（填写下方缩进字段）
#         type: directory # 说明：存储类型判别字段。；取值：字符串；取值：directory | volume
#         path: /srv/projects/project # 改为本机绝对目录；Windows 可用 C:/projects/project。 # 说明：本机绝对或相对目录，运行时归一化为真实绝对路径。；取值：字符串；最小字符数 1
#       repositories: # 说明：多个 Git 工程；默认空数组，不使用 Git 时仅创建文件目录。；取值：列表（每项以 - 开头）
#         - id: api # 说明：清单中的唯一 ID；同时用于受管理目录名。；取值：字符串；正则 ^[a-z0-9][\w-]{0,95}$
#           url: https://git.example.com/team/api.git # 说明：远程地址，不允许命令选项和换行。；取值：字符串；最小字符数 1
#           mainBranch: trunk # 必须明确每个工程的主分支。 # 说明：该工程明确指定的主分支，更新和 merge-main 发布均使用此值。；取值：字符串；最小字符数 1；最大字符数 240
# mcp: # 说明：MCP 配置；取值：配置块（填写下方缩进字段）
