# 本地开发使用 LanceDB；生产由 .env.prod 选择共享 Qdrant。
# 说明：后端或功能类型，按枚举选择
# 取值：字符串；取值：lancedb | pgvector | qdrant | chroma
type: ${HAI_VECDB_TYPE:lancedb}
# 说明：本地持久化路径（嵌入式模式：提供且无 url 时自动拉起本地服务）
# 取值：字符串；最小字符数 1
path: ${HAI_VECDB_PATH:./data/vecdb}
# 说明：pgvector：连接串；Qdrant：HTTP(S) 服务地址；Chroma：HTTP(S) 根端点，优先于 host/port，不允许凭据、路径前缀、query 或 fragment
# 取值：字符串；格式 uri
url: ${HAI_VECDB_URL:http://localhost:6333}
# 说明：Qdrant：API key；Chroma：Authorization Bearer token，用于同协议的自托管服务/网关，不提供 Chroma Cloud 契约
# 取值：字符串；Qdrant API key；Chroma 为空串或无空白的可打印 ASCII Bearer token
apiKey: ${HAI_VECDB_APIKEY:}
