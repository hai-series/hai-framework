# 应用信息
# 说明：应用名称（默认 'hai Admin'）
# 取值：字符串
name: ${HAI_CORE_NAME:hai ai playground}
# 说明：应用版本（默认 '0.1.0'）
# 取值：字符串
version: ${HAI_CORE_VERSION:0.1.0}
# 说明：运行环境（默认 'development'）
# 取值：字符串；取值：development | production | test | staging
env: ${HAI_CORE_ENV:development}

# 说明：日志配置（可选）
# 取值：配置块（填写下方缩进字段）
logging:
  # 说明：日志级别（默认 'info'）
  # 取值：字符串；取值：trace | debug | info | warn | error | fatal
  level: ${HAI_CORE_LOGGING_LEVEL:debug}
