[package]
name = "hai-desktop"
version = "0.1.0"
description = "hai Desktop App"
authors = [ "hai" ]
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "hai_desktop_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-shell = "2.5.0"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.152"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
base64 = "0.23"
minisign-verify = "0.3"
semver = "1"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
