# =============================================================================
# H5 App - 数据库配置
# =============================================================================

# 用途：后端或功能类型，按枚举选择
type: ${HAI_DB_TYPE:sqlite}
# 用途：数据库：SQLite文件路径或:memory:；PostgreSQL必填名称；MySQL无URL时必填，URL模式从URL读取
database: ${HAI_DB_DATABASE:./data/h5-app.db}
# 用途：数据库主机地址（默认 localhost）
host: ${HAI_DB_HOST:localhost}
# 用途：数据库端口 - PostgreSQL 默认 5432 - MySQL 默认 3306
port: ${HAI_DB_PORT:5432}
# 用途：数据库用户名
user: ${HAI_DB_USER:postgres}
# 用途：数据库密码
password: ${HAI_DB_PASSWORD:}
# 用途：网络数据库URL；MySQL空串表示使用分字段，非空仅mysql://且拒绝query/fragment，优先于host/port/database/user/password
url: ${HAI_DB_URL:}
# 用途：TLS：PostgreSQL使用其模式；MySQL仅false或严格对象，空对象默认校验证书链和DNS身份
ssl: ${HAI_DB_SSL:false}
