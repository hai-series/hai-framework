# =============================================================================
# H5 App - IAM 配置
# =============================================================================

# 说明：登录启用配置
# 取值：配置块（填写下方缩进字段）
login:
  # 说明：是否启用密码登录
  # 取值：true | false
  password: ${HAI_IAM_LOGIN_PASSWORD:true}
  # 说明：是否启用 OTP 登录
  # 取值：true | false
  otp: ${HAI_IAM_LOGIN_OTP:false}
  # 说明：是否启用 LDAP 登录；需要显式开启并提供 ldap 配置。
  # 取值：true | false
  ldap: ${HAI_IAM_LOGIN_LDAP:false}

# LDAP 可选：安装 ldapts 后开启 login.ldap，并声明连接配置或注入工厂。
# ldap: # 说明：LDAP 配置；取值：配置块（填写下方缩进字段）
#   url: ldaps://ldap.example.com:636 # 说明：LDAP 服务器 URL；取值：字符串；格式 uri
#   bindDn: cn=service,dc=example,dc=com # 说明：绑定 DN；取值：字符串
#   bindPassword: '${HAI_IAM_LDAP_BINDPASSWORD}' # 说明：绑定密码；取值：字符串
#   searchBase: ou=users,dc=example,dc=com # 说明：搜索基础 DN；取值：字符串

# 说明：密码配置
# 取值：配置块（填写下方缩进字段）
password:
  # 说明：新设密码的最少字符数；提高后只约束新建、重置和改密，不会反查已有密码的散列。
  # 取值：整数；>= 1
  minLength: ${HAI_IAM_PASSWORD_MINLENGTH:6}
  # 说明：新设密码的最多字符数，须不小于 minLength；避免超长输入消耗鉴别资源。
  # 取值：整数；>= 1；<= 256
  maxLength: ${HAI_IAM_PASSWORD_MAXLENGTH:128}
  # 说明：是否必须包含大写字母；与 minCharacterClasses 同时执行，false 仅取消这一项强制要求。
  # 取值：true | false
  requireUppercase: ${HAI_IAM_PASSWORD_REQUIREUPPERCASE:false}
  # 说明：是否必须包含小写字母；false 不代表取消长度或其他字符类别条件。
  # 取值：true | false
  requireLowercase: ${HAI_IAM_PASSWORD_REQUIRELOWERCASE:false}
  # 说明：是否必须包含数字；开启后所有服务端设密入口统一拒绝缺少数字的新密码。
  # 取值：true | false
  requireNumber: ${HAI_IAM_PASSWORD_REQUIRENUMBER:false}
  # 说明：是否必须包含特殊字符；开启会增加密码输入要求，不影响已经保存的密码散列。
  # 取值：true | false
  requireSpecialChar: ${HAI_IAM_PASSWORD_REQUIRESPECIALCHAR:false}

# 说明：注册配置
# 取值：配置块（填写下方缩进字段）
register:
  # 说明：是否允许访客自助注册；关闭后隐藏注册入口并由服务端拒绝注册，不影响已有账号登录或管理员创建账号。
  # 取值：true | false
  enabled: ${HAI_IAM_REGISTER_ENABLED:true}
  # 说明：自助注册的初始生命周期；active 可登录，dormant 等待管理员激活；默认 active。
  # 取值：字符串；取值：active | dormant
  defaultAccountStatus: ${HAI_IAM_REGISTER_DEFAULTACCOUNTSTATUS:active}

# 说明：会话配置
# 取值：配置块（填写下方缩进字段）
session:
  # 说明：页面离开时尽力撤销会话；浏览器关闭不可保证，仍应配置服务端闲置/绝对期限。
  # 取值：true | false
  endOnPageHide: ${HAI_IAM_SESSION_ENDONPAGEHIDE:false}
  # accessToken 有效期（秒，示例默认 900 = 15分钟）；严格闲置策略见 idleTimeout。
  # 说明：新会话的默认 access 时长（秒）；创建时可用 maxAge 覆盖，滑动/刷新沿用会话固有时长。
  # 取值：整数；>= 60
  maxAge: ${HAI_IAM_SESSION_MAXAGE:3600}
  # refreshToken 过期时间（秒，默认 604800 = 7天）
  # 说明：refreshToken 独立有效期（秒，默认 604800 = 7天）；从签发时刻起算，access 到期仍可刷新。
  # 取值：整数；>= 3600
  refreshTokenMaxAge: ${HAI_IAM_SESSION_REFRESHTOKENMAXAGE:604800}
  # 是否滑动窗口（每次访问刷新过期时间）
  # 说明：是否滑动窗口（每次访问刷新过期时间）
  # 取值：true | false
  sliding: ${HAI_IAM_SESSION_SLIDING:true}
  # 单设备登录（踢掉其他设备）
  # 说明：单设备登录（踢掉其他设备）
  # 取值：true | false
  singleDevice: ${HAI_IAM_SESSION_SINGLEDEVICE:false}

# 说明：RBAC 配置
# 取值：配置块（填写下方缩进字段）
rbac:
  # 说明：默认用户角色
  # 取值：字符串
  defaultRole: user

# 说明：是否初始化默认角色和权限（默认 true）
# 取值：true | false
seedDefaultData: ${HAI_IAM_SEEDDEFAULTDATA:true}

# 注册与登录安全
# 说明：安全策略配置
# 取值：配置块（填写下方缩进字段）
security:
  # 说明：固定窗口内达到此失败次数后锁定密码鉴别；验证码失败等独立入口按各自策略处理。
  # 取值：整数；>= 1
  maxLoginAttempts: ${HAI_IAM_SECURITY_MAXLOGINATTEMPTS:5}
  # 说明：达到失败阈值后禁止密码鉴别的秒数；至少60秒，1200表示20分钟，锁定期间正确密码也不能登录。
  # 取值：整数；>= 60
  lockoutDuration: ${HAI_IAM_SECURITY_LOCKOUTDURATION:900}

# OTP 需启用 login.otp，并选择 Reach 标准模板或自定义发送回调。
# 说明：OTP 配置
# 取值：配置块（填写下方缩进字段）
otp:
  # 说明：分别启用邮件、短信验证码
  # 取值：true | false
  email: ${HAI_IAM_OTP_EMAIL:true}
  # 说明：是否允许短信验证码
  # 取值：true | false
  sms: ${HAI_IAM_OTP_SMS:true}
  # 说明：验证码长度（默认 6）
  # 取值：整数；>= 4；<= 8
  length: ${HAI_IAM_OTP_LENGTH:6}
  # 说明：验证码过期时间（秒，默认 300）
  # 取值：整数；>= 60
  expiresIn: ${HAI_IAM_OTP_EXPIRESIN:300}
  # 说明：最大重试次数（默认 3）
  # 取值：整数；>= 1
  maxAttempts: ${HAI_IAM_OTP_MAXATTEMPTS:3}
  # 说明：发送间隔（秒，默认 60）
  # 取值：整数；>= 30
  resendInterval: ${HAI_IAM_OTP_RESENDINTERVAL:60}
# 说明：密码重置配置
# 取值：配置块（填写下方缩进字段）
passwordReset:
  # 说明：是否启用密码重置
  # 取值：true | false
  enabled: ${HAI_IAM_PASSWORDRESET_ENABLED:true}
  # 说明：重置通知渠道，phone 使用 password_reset_sms 模板。
  # 取值：字符串；取值：email | phone
  mode: ${HAI_IAM_PASSWORDRESET_MODE:email} # phone 使用 password_reset_sms 模板
  # 说明：重置令牌有效期（秒，默认 3600 = 1小时）
  # 取值：整数；>= 300
  tokenExpiresIn: ${HAI_IAM_PASSWORDRESET_TOKENEXPIRESIN:3600}
  # 说明：最大验证尝试次数（默认 3）
  # 取值：整数；>= 1
  maxAttempts: ${HAI_IAM_PASSWORDRESET_MAXATTEMPTS:3}
  # resetUrl: https://example.com/auth/reset-password # 说明：重置页面的绝对地址，通知模板可使用 resetUrl。；取值：字符串；格式 uri
# 说明：协议展示配置
# 取值：配置块（填写下方缩进字段）
agreements:
  # 说明：注册时展示协议
  # 取值：true | false
  showOnRegister: true
  # 说明：登录时展示协议
  # 取值：true | false
  showOnLogin: false
  # 说明：用户协议 Markdown 正文；同时配置 URL 时优先显示正文。
  # 取值：字符串；最小字符数 1
  userAgreementMarkdown: |
    # 用户协议示例

    请妥善保管账户凭据，并按应用提供的功能使用服务。
  # 说明：隐私协议 Markdown 正文；YAML 使用 | 保留段落和换行。
  # 取值：字符串；最小字符数 1
  privacyPolicyMarkdown: |
    # 隐私政策示例

    注册资料用于账户管理，会话信息用于身份认证。
  # userAgreementUrl: https://example.com/terms # 说明：用户协议 URL；取值：字符串；格式 uri
  # privacyPolicyUrl: https://example.com/privacy # 说明：隐私协议 URL；取值：字符串；格式 uri
# 说明：认证页外观
# 取值：配置块（填写下方缩进字段）
ui:
  # 说明：认证页布局样式
  # 取值：字符串；取值：card | split
  variant: card
  # title: Account center # 说明：认证面板标题；取值：字符串
  # subtitle: Welcome back # 说明：认证面板副标题；取值：字符串
  # brandTitle: Your application # 说明：认证页品牌区域标题；取值：字符串
  # brandText: Sign in securely # 说明：认证页品牌介绍正文；取值：字符串
  # logoUrl: /logo.svg # 说明：认证页品牌 Logo URL；取值：字符串
  # illustrationUrl: /auth-illustration.svg # 说明：认证页插图 URL；取值：字符串

  # 可选的自托管计算挑战；默认关闭，无外部验证码服务账号。
# 说明：可选的自托管交互挑战。
# 取值：配置块（填写下方缩进字段）
captcha:
  # 说明：是否在认证提交前校验自托管计算挑战；开启会有验证等待，关闭时不加载浏览器求解器。
  # 取值：true | false
  enabled: ${HAI_IAM_CAPTCHA_ENABLED:false}
  # 说明：挑战证明有效期，单位秒；到期或重复使用需重新计算，不是登录会话期限。
  # 取值：整数；>= 1；<= 600
  ttlSeconds: ${HAI_IAM_CAPTCHA_TTLSECONDS:120}
  # 说明：单次挑战的计算工作量；越高越难自动滥用，但低性能客户端等待也越久。
  # 取值：整数；>= 100；<= 50000
  cost: ${HAI_IAM_CAPTCHA_COST:5000}
  # 说明：求解随机计数范围；与 cost 共同决定客户端计算负担，不是密码失败次数。
  # 取值：整数；>= 1；<= 2000
  maxCounter: ${HAI_IAM_CAPTCHA_MAXCOUNTER:100}
