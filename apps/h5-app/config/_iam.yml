# =============================================================================
# H5 App - IAM 配置
# =============================================================================

# 用途：登录启用配置
login:
  # 用途：是否启用密码登录
  password: ${HAI_IAM_LOGIN_PASSWORD:true}
  # 用途：是否启用 OTP 登录
  otp: ${HAI_IAM_LOGIN_OTP:false}
  # 用途：是否启用 LDAP 登录；需要显式开启并提供 ldap 配置。
  ldap: ${HAI_IAM_LOGIN_LDAP:false}

# LDAP 可选：安装 ldapts 后开启 login.ldap，并声明连接配置或注入工厂。
# ldap:
#   url: ldaps://ldap.example.com:636
#   bindDn: cn=service,dc=example,dc=com
#   bindPassword: '${HAI_IAM_LDAP_BINDPASSWORD}'
#   searchBase: ou=users,dc=example,dc=com

# 用途：密码配置
password:
  # 用途：新设密码的最少字符数；提高后只约束新建、重置和改密，不会反查已有密码的散列。
  minLength: ${HAI_IAM_PASSWORD_MINLENGTH:6}
  # 用途：新设密码的最多字符数，须不小于 minLength；避免超长输入消耗鉴别资源。
  maxLength: ${HAI_IAM_PASSWORD_MAXLENGTH:128}
  # 用途：是否必须包含大写字母；与 minCharacterClasses 同时执行，false 仅取消这一项强制要求。
  requireUppercase: ${HAI_IAM_PASSWORD_REQUIREUPPERCASE:false}
  # 用途：是否必须包含小写字母；false 不代表取消长度或其他字符类别条件。
  requireLowercase: ${HAI_IAM_PASSWORD_REQUIRELOWERCASE:false}
  # 用途：是否必须包含数字；开启后所有服务端设密入口统一拒绝缺少数字的新密码。
  requireNumber: ${HAI_IAM_PASSWORD_REQUIRENUMBER:false}
  # 用途：是否必须包含特殊字符；开启会增加密码输入要求，不影响已经保存的密码散列。
  requireSpecialChar: ${HAI_IAM_PASSWORD_REQUIRESPECIALCHAR:false}

# 用途：注册配置
register:
  # 用途：是否允许访客自助注册；关闭后隐藏注册入口并由服务端拒绝注册，不影响已有账号登录或管理员创建账号。
  enabled: ${HAI_IAM_REGISTER_ENABLED:true}
  # 用途：自助注册的新账号是否立即启用；false 时账号已创建但不能登录，须由管理员审核启用，不改变已有账号。
  defaultEnabled: ${HAI_IAM_REGISTER_DEFAULTENABLED:true}

# 用途：会话配置
session:
  # 用途：页面离开时尽力撤销会话；浏览器关闭不可保证，仍应配置服务端闲置/绝对期限。
  endOnPageHide: ${HAI_IAM_SESSION_ENDONPAGEHIDE:false}
  # accessToken 有效期（秒，示例默认 900 = 15分钟）；严格闲置策略见 idleTimeout。
  # 用途：新会话的默认 access 时长（秒）；创建时可用 maxAge 覆盖，滑动/刷新沿用会话固有时长。
  maxAge: ${HAI_IAM_SESSION_MAXAGE:3600}
  # refreshToken 过期时间（秒，默认 604800 = 7天）
  # 用途：refreshToken 独立有效期（秒，默认 604800 = 7天）；从签发时刻起算，access 到期仍可刷新。
  refreshTokenMaxAge: ${HAI_IAM_SESSION_REFRESHTOKENMAXAGE:604800}
  # 是否滑动窗口（每次访问刷新过期时间）
  # 用途：是否滑动窗口（每次访问刷新过期时间）
  sliding: ${HAI_IAM_SESSION_SLIDING:true}
  # 单设备登录（踢掉其他设备）
  # 用途：单设备登录（踢掉其他设备）
  singleDevice: ${HAI_IAM_SESSION_SINGLEDEVICE:false}

# 用途：RBAC 配置
rbac:
  # 用途：默认用户角色
  defaultRole: user

# 用途：是否初始化默认角色和权限（默认 true）
seedDefaultData: ${HAI_IAM_SEEDDEFAULTDATA:true}

# 注册与登录安全
# 用途：安全策略配置
security:
  # 用途：固定窗口内达到此失败次数后锁定密码鉴别；验证码失败等独立入口按各自策略处理。
  maxLoginAttempts: ${HAI_IAM_SECURITY_MAXLOGINATTEMPTS:5}
  # 用途：达到失败阈值后禁止密码鉴别的秒数；至少60秒，1200表示20分钟，锁定期间正确密码也不能登录。
  lockoutDuration: ${HAI_IAM_SECURITY_LOCKOUTDURATION:900}

# OTP 需启用 login.otp，并选择 Reach 标准模板或自定义发送回调。
# 用途：OTP 配置
otp:
  # 用途：分别启用邮件、短信验证码
  email: ${HAI_IAM_OTP_EMAIL:true}
  # 用途：是否允许短信验证码
  sms: ${HAI_IAM_OTP_SMS:true}
  # 用途：验证码长度（默认 6）
  length: ${HAI_IAM_OTP_LENGTH:6}
  # 用途：验证码过期时间（秒，默认 300）
  expiresIn: ${HAI_IAM_OTP_EXPIRESIN:300}
  # 用途：最大重试次数（默认 3）
  maxAttempts: ${HAI_IAM_OTP_MAXATTEMPTS:3}
  # 用途：发送间隔（秒，默认 60）
  resendInterval: ${HAI_IAM_OTP_RESENDINTERVAL:60}
# 用途：密码重置配置
passwordReset:
  # 用途：是否启用密码重置
  enabled: ${HAI_IAM_PASSWORDRESET_ENABLED:true}
  # 用途：重置通知渠道，phone 使用 password_reset_sms 模板。
  mode: ${HAI_IAM_PASSWORDRESET_MODE:email} # phone 使用 password_reset_sms 模板
  # 用途：重置令牌有效期（秒，默认 3600 = 1小时）
  tokenExpiresIn: ${HAI_IAM_PASSWORDRESET_TOKENEXPIRESIN:3600}
  # 用途：最大验证尝试次数（默认 3）
  maxAttempts: ${HAI_IAM_PASSWORDRESET_MAXATTEMPTS:3}
  # resetUrl: https://example.com/auth/reset-password
# 用途：协议展示配置
agreements:
  # 用途：注册时展示协议
  showOnRegister: true
  # 用途：登录时展示协议
  showOnLogin: false
  # 用途：用户协议 Markdown 正文；同时配置 URL 时优先显示正文。
  userAgreementMarkdown: |
    # 用户协议示例

    请妥善保管账户凭据，并按应用提供的功能使用服务。
  # 用途：隐私协议 Markdown 正文；YAML 使用 | 保留段落和换行。
  privacyPolicyMarkdown: |
    # 隐私政策示例

    注册资料用于账户管理，会话信息用于身份认证。
  # userAgreementUrl: https://example.com/terms
  # privacyPolicyUrl: https://example.com/privacy
# 用途：认证页外观
ui:
  # 用途：认证页布局样式
  variant: card
  # title: Account center
  # subtitle: Welcome back
  # brandTitle: Your application
  # brandText: Sign in securely
  # logoUrl: /logo.svg
  # illustrationUrl: /auth-illustration.svg

  # 可选的自托管计算挑战；默认关闭，无外部验证码服务账号。
# 用途：可选的自托管交互挑战。
captcha:
  # 用途：是否在认证提交前校验自托管计算挑战；开启会有验证等待，关闭时不加载浏览器求解器。
  enabled: ${HAI_IAM_CAPTCHA_ENABLED:false}
  # 用途：挑战证明有效期，单位秒；到期或重复使用需重新计算，不是登录会话期限。
  ttlSeconds: ${HAI_IAM_CAPTCHA_TTLSECONDS:120}
  # 用途：单次挑战的计算工作量；越高越难自动滥用，但低性能客户端等待也越久。
  cost: ${HAI_IAM_CAPTCHA_COST:5000}
  # 用途：求解随机计数范围；与 cost 共同决定客户端计算负担，不是密码失败次数。
  maxCounter: ${HAI_IAM_CAPTCHA_MAXCOUNTER:100}
