# =============================================================================
# H5 App - IAM 配置
# =============================================================================

login:
  password: true
  otp: false
  ldap: false

# LDAP 可选：安装 ldapts 后开启 login.ldap，并声明连接配置或注入工厂。
# ldap:
#   url: ldaps://ldap.example.com:636
#   bindDn: cn=service,dc=example,dc=com
#   bindPassword: '${LDAP_BIND_PASSWORD}'
#   searchBase: ou=users,dc=example,dc=com

password:
  minLength: 6
  maxLength: 128
  requireUppercase: false
  requireLowercase: false
  requireNumber: false
  requireSpecialChar: false

register:
  enabled: true
  defaultEnabled: true

session:
  # 会话超时时间（秒，默认 86400 = 24小时）
  maxAge: 3600
  # refreshToken 过期时间（秒，默认 604800 = 7天）
  refreshTokenMaxAge: 604800
  # 是否滑动窗口（每次访问刷新过期时间）
  sliding: true
  # 单设备登录（踢掉其他设备）
  singleDevice: false

rbac:
  defaultRole: user

seedDefaultData: true

# 注册与登录安全
security:
  maxLoginAttempts: 5
  lockoutDuration: 900

# OTP 需启用 login.otp，并选择 Reach 标准模板或自定义发送回调。
otp:
  email: true
  sms: true
  length: 6
  expiresIn: 300
  maxAttempts: 3
  resendInterval: 60
passwordReset:
  enabled: true
  mode: email # phone 使用 password_reset_sms 模板
  tokenExpiresIn: 3600
  maxAttempts: 3
  # resetUrl: https://example.com/auth/reset-password
agreements:
  showOnRegister: true
  showOnLogin: false
  userAgreementMarkdown: |
    # 用户协议示例

    请妥善保管账户凭据，并按应用提供的功能使用服务。
  privacyPolicyMarkdown: |
    # 隐私政策示例

    注册资料用于账户管理，会话信息用于身份认证。
  # userAgreementUrl: https://example.com/terms
  # privacyPolicyUrl: https://example.com/privacy
ui:
  variant: card
  # title: Account center
  # subtitle: Welcome back
  # brandTitle: Your application
  # brandText: Sign in securely
  # logoUrl: /logo.svg
  # illustrationUrl: /auth-illustration.svg
