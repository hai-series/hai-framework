# =============================================================================
# Corporate Website - 触达服务配置
# =============================================================================
# 用于联系表单的邮件发送

# 说明：Provider 配置列表
# 取值：列表（每项以 - 开头）；最少项数 1
providers:
  # 说明：Provider 唯一名称
  # 取值：字符串；最小字符数 1
  - name: email
    # 说明：后端或功能类型，按枚举选择
    # 取值：字符串；取值：console | smtp | aliyun-sms | api
    type: ${HAI_REACH_PROVIDERS_0_TYPE:console}

# 说明：模板配置（通过配置文件注册）
# 取值：列表（每项以 - 开头）
templates:
  # 说明：模板名称
  # 取值：字符串；最小字符数 1
  - name: contact_form
    # 说明：绑定的 Provider 名称
    # 取值：字符串；最小字符数 1
    provider: email
    # 说明：邮件主题模板
    # 取值：字符串
    subject: 'New contact from website: {name}'
    # 说明：正文模板
    # 取值：字符串；最小字符数 1
    body: 'Name: {name}

      Email: {email}

      Message: {message}'
