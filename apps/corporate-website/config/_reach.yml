# =============================================================================
# Corporate Website - 触达服务配置
# =============================================================================
# 用于联系表单的邮件发送

# 用途：Provider 配置列表
providers:
  # 用途：Provider 唯一名称
  - name: email
    # 用途：后端或功能类型，按枚举选择
    type: ${HAI_REACH_PROVIDERS_0_TYPE:console}

# 用途：模板配置（通过配置文件注册）
templates:
  # 用途：模板名称
  - name: contact_form
    # 用途：绑定的 Provider 名称
    provider: email
    # 用途：邮件主题模板
    subject: 'New contact from website: {name}'
    # 用途：正文模板
    body: 'Name: {name}

      Email: {email}

      Message: {message}'
