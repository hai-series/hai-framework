# =============================================================================
# Corporate Website - 触达服务配置
# =============================================================================
# 用于联系表单的邮件发送

providers:
  - name: email
    type: ${HAI_REACH_PROVIDERS_0_TYPE:console}

templates:
  - name: contact_form
    provider: email
    subject: 'New contact from website: {name}'
    body: 'Name: {name}

      Email: {email}

      Message: {message}'
