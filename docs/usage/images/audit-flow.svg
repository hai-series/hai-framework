<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">审计记录、保护、备份与告警的关系</title><desc id="desc">先把重要操作保存下来，再按需要开启保护、私有备份和通知。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="470" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="468" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">审计记录、保护、备份与告警的关系</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">先把重要操作保存下来，再按需要开启保护、私有备份和通知。</text><rect x="30" y="115" width="230" height="125" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="148" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">业务操作</text><text x="48" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">自动采集框架事件</text><text x="48" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">业务也可 audit.log()</text><rect x="310" y="115" width="230" height="125" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="328" y="148" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">隐私处理</text><text x="328" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">密码、令牌始终遮盖</text><text x="328" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">fields 补充业务字段</text><rect x="590" y="115" width="240" height="125" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="608" y="148" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">共享数据库</text><text x="608" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">保存操作者、动作和结果</text><text x="608" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">启用保护后检查 minDays</text><path d="M260 175 L290 175" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 175 L570 175" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="480" y="305" width="260" height="105" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="498" y="338" font-size="20" fill="#946400" text-anchor="start" font-weight="650">私有备份</text><text x="498" y="369" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">backup.enabled: true</text><text x="498" y="394" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">另存一份 JSONL 到 Storage</text><rect x="790" y="305" width="260" height="105" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="808" y="338" font-size="20" fill="#946400" text-anchor="start" font-weight="650">规则告警</text><text x="808" y="369" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">alerts.enabled: true</text><text x="808" y="394" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">达到阈值后经 Reach 通知</text><path d="M675 240 L610 285" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M775 240 L915 285" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="446" font-size="16" fill="#526179" text-anchor="start" font-weight="400">保护期满不会自动删除；备份与告警独立启用，定时执行还要打开各自 schedule。</text></g></svg>
