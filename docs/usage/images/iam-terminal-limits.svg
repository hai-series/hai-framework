<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc"><title id="title">终端配额限制的是会话数量</title><desc id="desc">示例：maxSessions: 3，terminalLimits: { web: 2, app: 1 }。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="400" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="398" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">终端配额限制的是会话数量</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">示例：maxSessions: 3，terminalLimits: { web: 2, app: 1 }。</text><rect x="30" y="115" width="300" height="145" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="148" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">同一个账号</text><text x="48" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">总会话数最多 3 个</text><text x="48" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">各终端同时检查自己的配额</text><text x="48" y="229" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">终端类别由客户端声明</text><rect x="420" y="115" width="280" height="145" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="438" y="148" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">允许的终端</text><text x="438" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">Web：最多 2 个会话</text><text x="438" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">App：最多 1 个会话</text><rect x="770" y="115" width="280" height="145" rx="14" fill="#fceced" stroke="#b83b50" stroke-opacity=".28"/><text x="788" y="148" font-size="20" fill="#b83b50" text-anchor="start" font-weight="650">未列出的终端</text><text x="788" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">Desktop / API</text><text x="788" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">不允许新登录</text><path d="M330 155 L400 155" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M330 230 L750 290" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420" y="290" width="630" height="65" rx="14" fill="#f0f3f8" stroke="#526179" stroke-opacity=".28"/><text x="438" y="323" font-size="20" fill="#526179" text-anchor="start" font-weight="650">达到配额时</text><text x="438" y="354" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">reject：拒绝新登录；replace：结束旧会话，为新会话腾出位置。</text><text x="30" y="376" font-size="16" fill="#526179" text-anchor="start" font-weight="400">terminalLimits: {} 不按终端限额；这些设置不用于识别物理设备。</text></g></svg>
