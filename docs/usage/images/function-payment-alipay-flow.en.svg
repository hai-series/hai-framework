<svg xmlns="http://www.w3.org/2000/svg" width="400" height="692" viewBox="0 0 400 692" xml:lang="en" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Alipay WAP checkout and payment confirmation</title>
  <desc id="diagram-description">The merchant server signs a form locally. The browser posts the form to Alipay. The browser return displays order status and can arrive independently of the asynchronous notification. The merchant verifies the notification and commits the business transaction or recognizes an already processed event before returning HTTP 200 with the exact text success.</desc>
  <style>
    text { font-family: "Noto Sans", system-ui, sans-serif; fill: #172b4d; }
    .heading { font-size: 18px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 700; }
    .detail { font-size: 14px; fill: #334864; }
    .code { font: 14px ui-monospace, monospace; fill: #284d88; }
    .step { fill: #fff; stroke: #9eb5d5; }
    .browser { fill: #edf3ff; stroke: #9eb5d5; }
    .merchant { fill: #f0f7f3; stroke: #90b8a2; }
    .ack { fill: #e3f3e9; stroke: #69a181; }
    .ack-label, .ack-code { fill: #17452f; }
    .join { fill: none; stroke: #617995; stroke-width: 1.5; }
    .arrow { marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#617995"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="399" height="691" rx="15" fill="#f7f9fc" stroke="#d4deeb"/>

  <text class="heading" x="20" y="34">Start payment</text>
  <g>
    <rect class="step" x="20" y="48" width="360" height="78" rx="9"/>
    <text class="label" x="34" y="73">Merchant server prepares the form</text>
    <text class="code" x="34" y="95">payment.createOrder('alipay', …)</text>
    <text class="detail" x="34" y="114">Sign locally without calling the Alipay gateway</text>
  </g>
  <path class="join arrow" d="M200 126v19"/>
  <g>
    <rect class="browser" x="20" y="149" width="360" height="78" rx="9"/>
    <text class="label" x="34" y="174">Browser opens Alipay checkout</text>
    <text class="code" x="34" y="196">payment.client.invoke(order)</text>
    <text class="detail" x="34" y="215">POST the form to Alipay for the customer to pay</text>
  </g>

  <!-- 浏览器回跳与异步通知独立到达，从同一个网关节点分岔。 -->
  <path class="join" d="M200 227v13"/>
  <path class="join arrow" d="M200 240H105v15"/>
  <path class="join arrow" d="M200 240h95v15"/>
  <g>
    <rect class="browser" x="20" y="259" width="170" height="106" rx="9"/>
    <text class="label" x="32" y="283">Browser return</text>
    <text class="code" x="32" y="304">returnUrl</text>
    <text class="detail" x="32" y="327">Open the result page.</text>
    <text class="detail" x="32" y="348">Show order status.</text>
  </g>
  <g>
    <rect class="merchant" x="210" y="259" width="170" height="106" rx="9"/>
    <text class="label" x="222" y="283">Alipay notification</text>
    <text class="code" x="222" y="304">notifyUrl</text>
    <text class="detail" x="222" y="327">POST the raw form</text>
    <text class="detail" x="222" y="348">to the merchant.</text>
  </g>
  <path class="join arrow" d="M295 365v45"/>

  <text class="heading" x="20" y="393">Server confirms payment</text>
  <g>
    <rect class="merchant" x="20" y="414" width="360" height="78" rx="9"/>
    <text class="label" x="34" y="439">Verify the notification</text>
    <text class="code" x="34" y="461">payment.handleNotify('alipay', …)</text>
    <text class="detail" x="34" y="480">Check the signature, app ID and seller ID</text>
  </g>
  <path class="join arrow" d="M200 492v19"/>
  <g>
    <rect class="merchant" x="20" y="515" width="360" height="78" rx="9"/>
    <text class="label" x="34" y="540">Commit once or recognize a duplicate</text>
    <text class="detail" x="34" y="562">Match order, amount and currency. Deduplicate.</text>
    <text class="detail" x="34" y="581">For paid events, save status and queue fulfillment.</text>
  </g>
  <path class="join arrow" d="M200 593v19"/>
  <g>
    <rect class="ack" x="20" y="616" width="360" height="56" rx="9"/>
    <text class="label ack-label" x="34" y="639">Acknowledge the notification to Alipay</text>
    <text class="code ack-code" x="34" y="660">HTTP 200 · text/plain · success</text>
  </g>
</svg>
