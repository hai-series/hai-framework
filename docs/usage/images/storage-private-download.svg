<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc"><title id="title">私有文件怎样送到浏览器</title><desc id="desc">Serv 负责授权并生成短期地址，文件内容从对象存储直接传给浏览器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="450" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="448" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">私有文件怎样送到浏览器</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">Serv 负责授权并生成短期地址，文件内容从对象存储直接传给浏览器。</text><rect x="30" y="120" width="250" height="120" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="153" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">浏览器</text><text x="48" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">① 请求下载某个文件</text><text x="48" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">使用用户自己的登录状态</text><rect x="415" y="120" width="250" height="120" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="433" y="153" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">Serv</text><text x="433" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">检查资源访问权限</text><text x="433" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">② 返回短期签名 URL</text><rect x="800" y="120" width="250" height="120" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="818" y="153" font-size="20" fill="#946400" text-anchor="start" font-weight="650">S3 / RustFS</text><text x="818" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">验证签名、期限和对象键</text><text x="818" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">④ 返回文件内容</text><path d="M280 145 L395 145" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="337.5" y="135" font-size="14" fill="#526179" text-anchor="middle" font-weight="400">① 授权请求</text><path d="M415 215 L300 215" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="357.5" y="205" font-size="14" fill="#526179" text-anchor="middle" font-weight="400">② 签名地址</text><path d="M155 240 L155 305 L925 305 L925 260" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="292" font-size="16" fill="#526179" text-anchor="middle" font-weight="400">③ 浏览器请求 publicEndpoint，例如 https://app.example.com/files</text><text x="30" y="366" font-size="17" fill="#24344c" text-anchor="start" font-weight="400">服务端 endpoint：http://storage:9000</text><text x="30" y="396" font-size="17" fill="#24344c" text-anchor="start" font-weight="400">桶名：business；对象键：invoices/2026/report.pdf</text><text x="30" y="426" font-size="16" fill="#526179" text-anchor="start" font-weight="400">代理去掉 /files 等公开目录，保留签名所需 Host、对象路径和查询参数。</text></g></svg>
