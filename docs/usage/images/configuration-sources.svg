<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title desc"><title id="title">配置从哪里来，最后在哪里生效</title><desc id="desc">先合并环境值，再覆盖 YAML 已声明的字段，校验后交给模块。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="480" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="478" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">配置从哪里来，最后在哪里生效</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">先合并环境值，再覆盖 YAML 已声明的字段，校验后交给模块。</text><rect x="30" y="105" width="310" height="70" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="138" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">① 进程环境</text><text x="48" y="169" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">优先级最高</text><rect x="30" y="190" width="310" height="70" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="223" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">② .env.local</text><text x="48" y="254" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">本机私有值</text><rect x="30" y="275" width="310" height="70" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="308" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">③ .env.&lt;mode&gt;</text><text x="48" y="339" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">当前环境的公共差异</text><rect x="30" y="360" width="310" height="70" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="393" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">④ .env</text><text x="48" y="424" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">公共基础值</text><rect x="425" y="145" width="260" height="135" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="443" y="178" font-size="20" fill="#946400" text-anchor="start" font-weight="650">YAML 配置</text><text x="443" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">按 HAI_ 路径覆盖</text><text x="443" y="234" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">再解析 ${VAR:默认值}</text><text x="443" y="259" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">父对象覆盖优先于叶子</text><rect x="770" y="145" width="280" height="135" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="788" y="178" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">校验与初始化</text><text x="788" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">Schema 检查类型和范围</text><text x="788" y="234" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">补齐已声明的默认值</text><text x="788" y="259" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">模块使用最终配置</text><path d="M340 140 L405 180" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 225 L405 205" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 310 L405 235" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 395 L405 260" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M685 210 L750 210" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="456" font-size="16" fill="#526179" text-anchor="start" font-weight="400">修改后端运行配置后重启；连接池和外部客户端在启动时重新读取。</text></g></svg>
