<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" width="580" height="688" viewBox="0 0 580 688" role="img" aria-labelledby="title description">
  <title id="title">フィードバックの下書きから処理と回収まで</title>
  <desc id="description">サービスを起動し、下書きを作って内容を確認します。受理時に番号を受け取り、すぐに参照と処理ができます。ブラウザーは送信を続け、サーバーは追加収集、通知、Webhook を進めます。必要に応じて出力できます。期限切れの問題票は自動で回収します。</desc>
  <metadata id="diagram-source">flowchart TB
  A["1. フィードバックサービスを起動&lt;br/&gt;DB、非公開ストレージ、ブラウザー SDK を初期化"]
  B["2. 下書きを準備して確認&lt;br/&gt;資料の確認、画像のマスク、手元への ZIP 保存"]
  C["3. 送信して受付番号を取得&lt;br/&gt;失敗時は下書きを残し、同じ ID と内容で再送"]
  subgraph D["4. 受理後に送信とタスクを並行して実行"]
    direction LR
    Browser["ブラウザーの送信&lt;br/&gt;添付と追加資料を送信&lt;br/&gt;完了を通知"]
    Worker["サーバーのタスク&lt;br/&gt;追加資料を収集&lt;br/&gt;通知・Webhook を実行"]
  end
  E["5. 番号で参照・処理&lt;br/&gt;受付番号があれば資料が未着でも参照可能"]
  F["6. 必要に応じて ZIP を出力&lt;br/&gt;スナップショットを固定し、生成後にダウンロード"]
  G["すべての問題票を期限後に自動で回収"]
  A --&gt; B --&gt; C
  C --&gt; D
  C --&gt;|"受付番号を取得"| E
  D -.-&gt; E
  E --&gt; F
  C -.-&gt; G</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#557091"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; fill: #172b4d; }
    .step rect { fill: #edf3ff; stroke: #a6bbdf; }
    .accepted rect { fill: #e9f6ef; stroke: #79ac91; }
    .step-title { font-size: 22px; font-weight: 700; }
    .parallel-title { font-size: 18px; font-weight: 700; }
    .lane rect { fill: #ffffff; stroke: #c7d3e4; }
    .lane-title { font-size: 20px; font-weight: 700; }
    .note { font-size: 17.5px; fill: #314968; }
    .arrow { fill: none; stroke: #557091; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect x="1" y="1" width="578" height="686" rx="16" fill="#ffffff" stroke="#dce3ef"/>
  <g>
    <path class="arrow" d="M305 86 V106"/>
    <path class="arrow" d="M305 174 V194"/>
    <path class="arrow" d="M305 262 V284"/>
    <path class="arrow" d="M50 228 H24 V502 H48"/>
    <path class="arrow" d="M305 432 V467" stroke-dasharray="4 4"/>
    <path class="arrow" d="M305 535 V557"/>
    <g class="step">
      <rect x="50" y="20" width="510" height="66" rx="10"/>
      <text class="step-title" x="69" y="49">1. フィードバックサービスを起動</text>
      <text class="note" x="69" y="73">DB、非公開ストレージ、ブラウザー SDK を初期化</text>
    </g>
    <g class="step">
      <rect x="50" y="108" width="510" height="66" rx="10"/>
      <text class="step-title" x="69" y="137">2. 下書きを準備して確認</text>
      <text class="note" x="69" y="161">資料の確認、画像のマスク、手元への ZIP 保存</text>
    </g>
    <g class="step accepted">
      <rect x="50" y="196" width="510" height="66" rx="10"/>
      <text class="step-title" x="69" y="225">3. 送信して受付番号を取得</text>
      <text class="note" x="69" y="249">失敗時は下書きを残し、同じ ID と内容で再送</text>
    </g>
    <g class="step">
      <rect x="50" y="469" width="510" height="66" rx="10"/>
      <text class="step-title" x="69" y="498">5. 番号で参照・処理</text>
      <text class="note" x="69" y="522">受付番号があれば資料が未着でも参照可能</text>
    </g>
    <g class="step">
      <rect x="50" y="559" width="510" height="66" rx="10"/>
      <text class="step-title" x="69" y="588">6. 必要に応じて ZIP を出力</text>
      <text class="note" x="69" y="612">スナップショットを固定し、生成後にダウンロード</text>
    </g>
    <g>
      <rect x="50" y="286" width="510" height="146" rx="10" fill="#f2f5fa" stroke="#c7d3e4"/>
      <text class="parallel-title" x="69" y="314">4. 受理後に送信とタスクを並行して実行</text>
      <g class="lane">
        <rect x="65" y="331" width="235" height="85" rx="8"/>
        <text class="lane-title" x="77" y="356">ブラウザーの送信</text>
        <text class="note" x="77" y="382">添付と追加資料を送信</text>
        <text class="note" x="77" y="403">完了を通知</text>
      </g>
      <g class="lane">
        <rect x="310" y="331" width="235" height="85" rx="8"/>
        <text class="lane-title" x="322" y="356">サーバーのタスク</text>
        <text class="note" x="322" y="382">追加資料を収集</text>
        <text class="note" x="322" y="403">通知・Webhook を実行</text>
      </g>
    </g>
    <rect x="50" y="642" width="510" height="29" rx="7" fill="#f2f5fa"/>
    <text class="note" x="69" y="662">すべての問題票を期限後に自動で回収</text>
  </g>
</svg>
