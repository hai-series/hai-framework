<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="title desc"><title id="title">从构建到部署成功，再到配置重启</title><desc id="desc">交付镜像和配置，健康检查成功后才更新服务器的成功发布记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="450" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="448" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">从构建到部署成功，再到配置重启</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">交付镜像和配置，健康检查成功后才更新服务器的成功发布记录。</text><rect x="30" y="115" width="220" height="125" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="148" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">① 构建与打包</text><text x="48" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">image 构建应用镜像</text><text x="48" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">收集配置和中间件归档</text><text x="48" y="229" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">生成摘要与交付包</text><rect x="300" y="115" width="220" height="125" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="318" y="148" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">② 服务器预检</text><text x="318" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">检查包、端口和基线</text><text x="318" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">保留凭据与数据卷</text><text x="318" y="229" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">按选择更新服务</text><rect x="570" y="115" width="220" height="125" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="588" y="148" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">③ 后端启动</text><text x="588" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">读取挂载的 .env.runtime</text><text x="588" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">校验配置并初始化依赖</text><text x="588" y="229" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">按实际健康路径检查</text><rect x="840" y="115" width="210" height="125" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="858" y="148" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">④ 发布成功</text><text x="858" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">健康检查通过</text><text x="858" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">更新 current 记录</text><path d="M250 175 L280 175" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 175 L550 175" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 175 L820 175" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="305" width="720" height="80" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="348" y="338" font-size="20" fill="#946400" text-anchor="start" font-weight="650">日常调整运行配置</text><text x="348" y="369" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">编辑后端实际挂载的 .env.runtime → restart 同一容器 → 检查健康和业务行为。</text><text x="30" y="426" font-size="16" fill="#526179" text-anchor="start" font-weight="400">代理路由、端口或挂载变化仍需部署；恢复旧容器不等于恢复业务数据库。</text></g></svg>
