<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">一条模型请求怎样选择协议</title><desc id="desc">模型项优先于全局设置；protocol 只决定请求格式，不是模型名称。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="430" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="428" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">一条模型请求怎样选择协议</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">模型项优先于全局设置；protocol 只决定请求格式，不是模型名称。</text><rect x="30" y="120" width="270" height="140" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="153" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">选择模型</text><text x="48" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">显式指定 model 优先</text><text x="48" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">否则按 scenarios 选择</text><text x="48" y="234" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">例如 chat → fast</text><rect x="365" y="120" width="310" height="140" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="383" y="153" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">找到 models 中的条目</text><text x="383" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">id: fast 是应用短名</text><text x="383" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">model 是供应商真实型号</text><text x="383" y="234" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">protocol 可覆盖 llm.protocol</text><rect x="750" y="100" width="300" height="85" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="768" y="133" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">chat</text><text x="768" y="164" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">Chat Completions / 兼容接口</text><rect x="750" y="200" width="300" height="85" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="768" y="233" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">responses</text><text x="768" y="264" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">OpenAI Responses 接口</text><rect x="750" y="300" width="300" height="85" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="768" y="333" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">anthropic</text><text x="768" y="364" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">Anthropic Messages 接口</text><path d="M300 185 L345 185" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 165 L730 142" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 200 L730 242" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 235 L730 342" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="406" font-size="16" fill="#526179" text-anchor="start" font-weight="400">不同供应商建议在模型项分别设置 apiKey 和 baseUrl，避免串用地址或账号。</text></g></svg>
