<svg xmlns="http://www.w3.org/2000/svg" width="520" height="466" viewBox="0 0 520 466" role="img" aria-labelledby="title desc">
  <title id="title">Review diagnostics and submit, ask for information, and record the outcome</title>
  <desc id="desc">Review diagnostics and submit。Open the same report。Staff request more information。The author replies with details。Staff reply with the outcome</desc>
  <metadata id="diagram-source">flowchart TB
  A["Review diagnostics and submit&lt;br/&gt;Screenshot, recent logs, replay and recording"]
  B["Open the same report&lt;br/&gt;Pending"]
  C["Staff request more information&lt;br/&gt;Awaiting user"]
  D["The author replies with details&lt;br/&gt;Back to Pending"]
  E["Staff reply with the outcome&lt;br/&gt;Mark Handled"]
  A --&gt; B --&gt; C --&gt; D --&gt; E
  B --&gt; E</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#526d90"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; fill: #172b4d; }
    .title { font-weight: 700; font-size: 22px; }
    .note { font-size: 18px; fill: #334d70; }
    g rect { fill: #eef4ff; stroke: #a7bddc; }
    .arrows path { fill: none; stroke: #526d90; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect x="1" y="1" width="518" height="464" rx="14" fill="#ffffff" stroke="#d9e3f1"/>
  <g class="arrows">
    <path d="M260 86 V108"/>
    <path d="M260 176 V198"/>
    <path d="M260 266 V288"/>
    <path d="M260 356 V378"/>
    <path d="M482 143 H500 V413 H485" stroke-dasharray="4 4"/>
  </g>
  <g>
    <g><rect x="38" y="20" width="444" height="66" rx="9"/>
      <text x="57" y="49" class="title">Review diagnostics and submit</text>
      <text x="57" y="72" class="note">Screenshot, recent logs, replay and recording</text></g>
    <g><rect x="38" y="110" width="444" height="66" rx="9"/>
      <text x="57" y="139" class="title">Open the same report</text>
      <text x="57" y="162" class="note">Pending</text></g>
    <g><rect x="38" y="200" width="444" height="66" rx="9"/>
      <text x="57" y="229" class="title">Staff request more information</text>
      <text x="57" y="252" class="note">Awaiting user</text></g>
    <g><rect x="38" y="290" width="444" height="66" rx="9"/>
      <text x="57" y="319" class="title">The author replies with details</text>
      <text x="57" y="342" class="note">Back to Pending</text></g>
    <g><rect x="38" y="380" width="444" height="66" rx="9"/>
      <text x="57" y="409" class="title">Staff reply with the outcome</text>
      <text x="57" y="432" class="note">Mark Handled</text></g>
  </g>
</svg>
