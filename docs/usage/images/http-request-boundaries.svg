<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc"><title id="title">代理、访问条件与业务授权各管哪一层</title><desc id="desc">可信代理确认客户端地址，访问策略检查来源与时段，业务接口继续执行权限检查。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="360" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="358" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">代理、访问条件与业务授权各管哪一层</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">可信代理确认客户端地址，访问策略检查来源与时段，业务接口继续执行权限检查。</text><rect x="30" y="120" width="210" height="130" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="153" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">浏览器 / 调用方</text><text x="48" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">发送 HTTPS 请求</text><text x="48" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">携带自己的认证信息</text><rect x="300" y="120" width="210" height="130" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="318" y="153" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">反向代理</text><text x="318" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">覆盖可信转发头</text><text x="318" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">按配置传递真实 IP</text><rect x="570" y="120" width="210" height="130" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="588" y="153" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">Serv / Kit</text><text x="588" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">trustedProxies 验证来源</text><text x="588" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">access 检查 IP / 时段</text><text x="588" y="234" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">按路径处理加密策略</text><rect x="840" y="120" width="210" height="130" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="858" y="153" font-size="20" fill="#946400" text-anchor="start" font-weight="650">业务接口</text><text x="858" y="184" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">验证账号与会话</text><text x="858" y="209" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">检查资源访问权限</text><path d="M240 185 L280 185" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M510 185 L550 185" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M780 185 L820 185" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="336" font-size="16" fill="#526179" text-anchor="start" font-weight="400">允许某个 IP 或关闭应用层加密，都不会自动授予业务数据权限。</text></g></svg>
