<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc"><title id="title">登录时段如何判断</title><desc id="desc">使用服务器时钟和指定时区；时间窗限制新登录，不主动结束已有会话。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="430" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="428" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">登录时段如何判断</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">使用服务器时钟和指定时区；时间窗限制新登录，不主动结束已有会话。</text><rect x="30" y="110" width="300" height="125" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="143" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">启用 loginAccess</text><text x="48" y="174" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">enabled: true</text><text x="48" y="199" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">先检查允许 / 拒绝的 IP</text><rect x="390" y="110" width="300" height="125" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="408" y="143" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">按 timezone 换算</text><text x="408" y="174" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">Asia/Shanghai：北京时间</text><text x="408" y="199" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">windows 任一时段匹配即可</text><rect x="750" y="110" width="300" height="125" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="768" y="143" font-size="20" fill="#946400" text-anchor="start" font-weight="650">决定是否允许登录</text><text x="768" y="174" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">IP 与时间都符合：继续登录</text><text x="768" y="199" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">不符合：拒绝新登录</text><path d="M330 172 L370 172" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 172 L730 172" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="282" font-size="19" fill="#172b4d" text-anchor="start" font-weight="600">跨午夜示例：days: [5]，start: 22:00，end: 02:00</text><rect x="60" y="330" width="960" height="18" rx="9" fill="#e4eaf3"/><rect x="330" y="330" width="420" height="18" rx="9" fill="#0b7661"/><text x="330" y="315" font-size="16" fill="#0b7661" text-anchor="middle" font-weight="400">周五 22:00 · 包含</text><text x="750" y="315" font-size="16" fill="#0b7661" text-anchor="middle" font-weight="400">周六 02:00 · 不包含</text><text x="30" y="406" font-size="16" fill="#526179" text-anchor="start" font-weight="400">days 填开始日：周一 1 至周日 7；windows: [] 表示不限时间。</text></g></svg>
