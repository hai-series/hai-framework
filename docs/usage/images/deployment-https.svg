<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">容器部署的可选 HTTPS 入口</title><desc id="desc">在部署向导选择证书来源，Nginx 处理 HTTPS，应用继续使用容器内连接。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#66758b"/></marker></defs><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect width="1080" height="440" rx="18" fill="#fff"/><rect x="1" y="1" width="1078" height="438" rx="17" fill="none" stroke="#dce3ef"/><text x="30" y="43" font-size="26" fill="#172b4d" text-anchor="start" font-weight="700">容器部署的可选 HTTPS 入口</text><text x="30" y="74" font-size="16" fill="#526179" text-anchor="start" font-weight="400">在部署向导选择证书来源，Nginx 处理 HTTPS，应用继续使用容器内连接。</text><rect x="30" y="115" width="300" height="100" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="48" y="148" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">已有证书</text><text x="48" y="179" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">指定证书链和私钥路径</text><text x="48" y="204" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">部署时复制到服务器</text><rect x="30" y="250" width="300" height="120" rx="14" fill="#fff5dc" stroke="#946400" stroke-opacity=".28"/><text x="48" y="283" font-size="20" fill="#946400" text-anchor="start" font-weight="650">Let’s Encrypt</text><text x="48" y="314" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">官方 Certbot 申请 / 续期</text><text x="48" y="339" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">域名指向服务器，开放 80</text><text x="48" y="364" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">每 12 小时检查是否需续期</text><rect x="430" y="165" width="250" height="145" rx="14" fill="#e8f7f3" stroke="#0b7661" stroke-opacity=".28"/><text x="448" y="198" font-size="20" fill="#0b7661" text-anchor="start" font-weight="650">Nginx 入口</text><text x="448" y="229" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">挂载证书与私钥</text><text x="448" y="254" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">对外提供 HTTPS</text><text x="448" y="279" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">证书更新后重新加载</text><rect x="780" y="165" width="270" height="145" rx="14" fill="#eaf0ff" stroke="#315bf5" stroke-opacity=".28"/><text x="798" y="198" font-size="20" fill="#315bf5" text-anchor="start" font-weight="650">应用容器</text><text x="798" y="229" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">Serv / SvelteKit SSR</text><text x="798" y="254" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">或 Web + Serv</text><text x="798" y="279" font-size="16" fill="#24344c" text-anchor="start" font-weight="400">无需把私钥放进镜像</text><path d="M330 165 L410 205" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M330 305 L410 270" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 235 L760 235" fill="none" stroke="#66758b" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="416" font-size="16" fill="#526179" text-anchor="start" font-weight="400">未选择 HTTPS 时保持 HTTP；已有证书到期需替换文件，Certbot 方案由续期流程更新。</text></g></svg>
