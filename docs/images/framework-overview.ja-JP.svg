<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" role="img" aria-labelledby="title desc" xml:lang="ja-JP">
  <title id="title">hai Framework：AI 協働から業務アプリまで</title>
  <desc id="desc">開発者と AI が規約を共有し、Web、App、Desktop が API 契約を共有します。業務サービスは AI、データ、認証、監査を組み合わせ、共通設定から Provider を選択します。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101a30"/><stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#7f91b2" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="Segoe UI, Microsoft YaHei, Meiryo, sans-serif">
  <rect x="1" y="1" width="1118" height="650" rx="20" fill="url(#background)" stroke="#283753"/>
  <rect x="40" y="32" width="44" height="44" rx="12" fill="#7259ed"/>
  <path d="M53 42v24m0-13c10-9 18-6 18 4v9" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <text x="98" y="64" font-size="32" fill="#f5f7fc" font-weight="700">hai Framework</text>
  <text x="1080" y="54" font-size="14" fill="#a8b7d1" text-anchor="end">TypeScript · 22 packages</text>
  <text x="40" y="107" font-size="21" fill="#c4cee0" >開発者と AI が同じ業務プロジェクトで協働する</text>
  <rect x="40" y="130" width="1040" height="82" rx="14" fill="#152137" stroke="#354568"/>
  <text x="60" y="155" font-size="12" fill="#b7abfa" font-weight="600" letter-spacing=".8">開発者 + AI コーディング支援</text>
  <text x="60" y="188" font-size="21" fill="#f0f3fa" font-weight="600">要件と設計  →  Skills と実装  →  テストとレビュー</text>
  <text x="1060" y="156" font-size="13" fill="#a8b7d1" text-anchor="end">規約もプロジェクトに同梱</text>
  <rect x="40" y="247" width="220" height="60" rx="14" fill="#152137" stroke="#2a3853"/>
  <text x="60" y="273" font-size="20" fill="#edf3fc" font-weight="600">Web</text>
  <text x="60" y="295" font-size="13" fill="#a8b7d1" >SvelteKit / Vite</text>
  <rect x="40" y="321" width="220" height="60" rx="14" fill="#152137" stroke="#2a3853"/>
  <text x="60" y="347" font-size="20" fill="#edf3fc" font-weight="600">App</text>
  <text x="60" y="369" font-size="13" fill="#a8b7d1" >Capacitor</text>
  <rect x="40" y="395" width="220" height="60" rx="14" fill="#152137" stroke="#2a3853"/>
  <text x="60" y="421" font-size="20" fill="#edf3fc" font-weight="600">Desktop</text>
  <text x="60" y="443" font-size="13" fill="#a8b7d1" >Tauri</text>
  <path d="M260 277h16v74h22m-38 74h16v-74m-16 0h16" fill="none" stroke="#7f91b2" stroke-width="2"/>
  <path d="M276 351H298" fill="none" stroke="#7f91b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="308" y="298" width="196" height="106" rx="14" fill="#221f40" stroke="#6657a3"/>
  <text x="406" y="324" font-size="13" fill="#bfb2fa" text-anchor="middle">api-contract</text>
  <text x="406" y="355" font-size="19" fill="#f4f0ff" text-anchor="middle" font-weight="650">共通 API 契約</text>
  <text x="406" y="382" font-size="14" fill="#beb6d9" text-anchor="middle">入力 · 出力 · 型</text>
  <path d="M504 351H538" fill="none" stroke="#7f91b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="239" width="530" height="244" rx="14" fill="#121e32" stroke="#3b4e70"/>
  <text x="570" y="274" font-size="21" fill="#f0f4fc" font-weight="650">業務サービス</text>
  <text x="1058" y="273" font-size="14" fill="#a8b7d1" text-anchor="end">Serv</text>
  <rect x="570" y="291" width="238" height="72" rx="10" fill="#17243a" stroke="#2d3c57"/>
  <rect x="570" y="305" width="3" height="44" rx="1.5" fill="#aa8ffa"/>
  <text x="586" y="319" font-size="18" fill="#eef3fb" font-weight="650">AI 機能</text>
  <text x="586" y="344" font-size="13" fill="#a8b7d1" >LLM / MCP / RAG / Memory</text>
  <rect x="822" y="291" width="238" height="72" rx="10" fill="#17243a" stroke="#2d3c57"/>
  <rect x="822" y="305" width="3" height="44" rx="1.5" fill="#56c7b6"/>
  <text x="838" y="319" font-size="18" fill="#eef3fb" font-weight="650">データとストレージ</text>
  <text x="838" y="344" font-size="13" fill="#a8b7d1" >DB / Cache / Storage / VecDB</text>
  <rect x="570" y="381" width="238" height="72" rx="10" fill="#17243a" stroke="#2d3c57"/>
  <rect x="570" y="395" width="3" height="44" rx="1.5" fill="#e6b86a"/>
  <text x="586" y="409" font-size="18" fill="#eef3fb" font-weight="650">認証と暗号化</text>
  <text x="586" y="434" font-size="13" fill="#a8b7d1" >IAM / RBAC / SM2・SM3・SM4</text>
  <rect x="822" y="381" width="238" height="72" rx="10" fill="#17243a" stroke="#2d3c57"/>
  <rect x="822" y="395" width="3" height="44" rx="1.5" fill="#6ba6ed"/>
  <text x="838" y="409" font-size="18" fill="#eef3fb" font-weight="650">監査とフィードバック</text>
  <text x="838" y="434" font-size="13" fill="#a8b7d1" >安全イベント / 証跡 / 診断</text>
  <path d="M814 527V494" fill="none" stroke="#7f91b2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="527" width="1040" height="78" rx="14" fill="#132a2e" stroke="#2c5d5b"/>
  <text x="60" y="552" font-size="12" fill="#77d2c4" font-weight="650" letter-spacing=".6">共通の設定入口</text>
  <text x="60" y="584" font-size="19" fill="#def5ee" font-weight="500">YAML + 環境変数 + Schema → モジュール設定と Provider 選択</text>
  <text x="40" y="633" font-size="14" fill="#9eacc5" >CLI はコード、設定、Skills、配布ツールを同梱。22 パッケージを個別にも利用できます。</text>
  </g>
</svg>
