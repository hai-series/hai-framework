  <text x="60" y="584" font-size="19" fill="#def5ee" font-weight="500">YAML + environment + schemas → module settings &amp; provider selection</text>
  <text x="40" y="633" font-size="14" fill="#9eacc5" >CLI templates ship application code, configuration, Skills and delivery tools. Use 22 packages as needed.</text>
