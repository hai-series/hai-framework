  <rect x="570" y="395" width="3" height="44" rx="1.5" fill="#e6b86a"/>
  <text x="586" y="409" font-size="18" fill="#eef3fb" font-weight="650">Identity &amp; crypto</text>
  <text x="586" y="434" font-size="13" fill="#a8b7d1" >IAM / RBAC / SM2・SM3・SM4</text>
  <rect x="822" y="381" width="238" height="72" rx="10" fill="#17243a" stroke="#2d3c57"/>
  <rect x="822" y="395" width="3" height="44" rx="1.5" fill="#6ba6ed"/>
  <text x="838" y="409" font-size="18" fill="#eef3fb" font-weight="650">Audit &amp; feedback</text>
  <text x="838" y="434" font-size="13" fill="#a8b7d1" >Events / Evidence / Diagnostics</text>
  <path d="M814 527V494" fill="none" stroke="#7f91b2" stroke-width="2" marker-end="url(#arrow)"/>
