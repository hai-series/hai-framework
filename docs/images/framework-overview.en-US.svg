<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" role="img" aria-labelledby="title desc" xml:lang="en-US">
  <title id="title">hai Framework: AI collaboration and business applications</title>
  <desc id="desc">Developers and coding agents share project guidance. Web, App and Desktop share an API contract; business services compose AI, data, identity and audit with configurable providers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101a30"/><stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
