# =============================================================================
# hai-framework Release Workflow
# =============================================================================
#
# 触发条件：main 分支的 push 事件
# 工作流程：
#   1. 检测根 package.json 版本号是否已有对应 Tag
#   2. 全量单元测试 + E2E 测试
#   3. 同步版本号到所有子模块并提交
#   4. 创建 Git Tag + GitHub Release（含分类变更日志）
#   5. 发布公共包到 npm
# =============================================================================

name: Release

on:
  push:
    branches: [main]

# 同一时间只允许一个发布流程
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 检测版本是否已发布（是否存在对应 Tag）
  # ===========================================================================
  detect-version:
    name: Detect Version Change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release tag existence
        id: check
        run: |
          # 获取当前版本
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT"

          VERSION_TAG="v${CURRENT}"
          echo "Checking tags: ${VERSION_TAG} (and fallback: ${CURRENT})"

          if git rev-parse "${VERSION_TAG}" >/dev/null 2>&1 || git rev-parse "${CURRENT}" >/dev/null 2>&1; then
            echo "Tag for current version already exists, skip build/release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No tag found for current version, trigger build/release"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # 测试
  # ---------------------------------------------------------------------------
  # 单元测试通过 Testcontainers 动态启动以下容器（需要 Docker 守护进程）：
  #   - postgres:alpine          (reldb, iam)
  #   - mysql:8                  (reldb)
  #   - redis:alpine             (cache, iam)
  #   - pgvector/pgvector:pg17   (vecdb)
  #   - qdrant/qdrant:latest     (vecdb)
  #   - minio/minio:latest       (storage)
  #   - osixia/openldap:latest   (iam)
  # ubuntu-latest 自带 Docker，无需额外安装。
  # ===========================================================================
  test:
    name: Test
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Testcontainer images
        run: |
          docker pull postgres:alpine &
          docker pull mysql:8 &
          docker pull redis:alpine &
          docker pull pgvector/pgvector:pg17 &
          docker pull qdrant/qdrant:latest &
          docker pull minio/minio:latest &
          docker pull osixia/openldap:latest &
          wait

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter admin-console exec playwright install --with-deps chrome

      # 全部应用的 E2E（admin-console / corporate-website / h5-app / mobile-app）
      # 与 CLI 脚手架门禁，任一失败即阻断发布——不再只跑 admin-console。
      - name: E2E tests
        run: pnpm e2e

  # ===========================================================================
  # 同步版本 + 创建 Release + 发布 npm
  # ===========================================================================
  release:
    name: Release
    needs: [detect-version, test]
    if: needs.detect-version.outputs.changed == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ----- 同步版本号 -----
      - name: Sync versions
        run: node scripts/sync-versions.mjs

      - name: Commit version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: sync version to v${{ needs.detect-version.outputs.version }} [skip ci]"
            git push || { echo "Error: push failed, branch may have moved. Re-run release from latest main."; exit 1; }
          fi

      # ----- 创建 Tag + Release -----
      - name: Generate release notes
        id: notes
        run: |
          VERSION="v${{ needs.detect-version.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          CONTRIBUTORS_URL="${REPO_URL}/graphs/contributors"

          # 查找“当前提交之前”的最近发布 tag（按提交历史，不按字符串版本排序）
          # 这样可以稳定得到“上一个版本 -> 当前版本”的差异，避免 alpha 预发布号排序失真。
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            COMPARE_SECTION=""
          else
            RANGE="${PREV_TAG}..HEAD"
            COMPARE_SECTION="## 🔍 Full Changelog\n- [${PREV_TAG}...${VERSION}](${REPO_URL}/compare/${PREV_TAG}...${VERSION})\n\n"
          fi

          # 收集 commits 并分类
          FEATURES=""
          FIXES=""
          REFACTORS=""
          DOCS=""
          PERF=""
          TESTS=""
          CHORES=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # 提取 commit message（去掉 hash 前缀）
            MSG="${line#* }"
            case "$MSG" in
              feat:*|feat\(*) FEATURES="${FEATURES}\n- ${MSG}" ;;
              fix:*|fix\(*)   FIXES="${FIXES}\n- ${MSG}" ;;
              refactor:*|refactor\(*) REFACTORS="${REFACTORS}\n- ${MSG}" ;;
              docs:*|docs\(*) DOCS="${DOCS}\n- ${MSG}" ;;
              perf:*|perf\(*) PERF="${PERF}\n- ${MSG}" ;;
              test:*|test\(*) TESTS="${TESTS}\n- ${MSG}" ;;
              chore:*|chore\(*|ci:*|ci\(*|build:*|build\(*) CHORES="${CHORES}\n- ${MSG}" ;;
              *)              OTHER="${OTHER}\n- ${MSG}" ;;
            esac
          done <<< "$(git log "$RANGE" --oneline --no-merges 2>/dev/null)"

          # 组装 release notes
          NOTES=""
          [ -n "$FEATURES" ] && NOTES="${NOTES}## ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES" ]    && NOTES="${NOTES}## 🐛 Bug Fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && NOTES="${NOTES}## ♻️ Refactoring\n${REFACTORS}\n\n"
          [ -n "$PERF" ]     && NOTES="${NOTES}## ⚡ Performance\n${PERF}\n\n"
          [ -n "$DOCS" ]     && NOTES="${NOTES}## 📖 Documentation\n${DOCS}\n\n"
          [ -n "$TESTS" ]    && NOTES="${NOTES}## 🧪 Tests\n${TESTS}\n\n"
          [ -n "$CHORES" ]   && NOTES="${NOTES}## 🔧 Chores\n${CHORES}\n\n"
          [ -n "$OTHER" ]    && NOTES="${NOTES}## 📦 Other\n${OTHER}\n\n"

          if [ -z "$NOTES" ]; then
            NOTES="Initial release ${VERSION}"
          fi

          NOTES="${NOTES}${COMPARE_SECTION}## 🙌 Contributors\n- [View all contributors](${CONTRIBUTORS_URL})\n\n"

          # 写入文件以避免多行变量问题（printf '%b' 比 echo -e 更可靠，不会误解释 commit 中的转义字符）
          printf '%b' "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create tag
        run: |
          VERSION="v${{ needs.detect-version.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping creation"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION" || echo "Tag $VERSION already pushed to remote"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: v${{ needs.detect-version.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ----- 发布到 npm -----
      - name: Publish to npm
        run: |
          echo "Publishing public packages to npm..."
          FAILED=0

          for pkg in packages/*/; do
            PKG_JSON="${pkg}package.json"
            if [ ! -f "$PKG_JSON" ]; then
              continue
            fi

            IS_PRIVATE=$(node -p "require('./${PKG_JSON}').private || false")
            PKG_NAME=$(node -p "require('./${PKG_JSON}').name")
            PKG_VERSION=$(node -p "require('./${PKG_JSON}').version")

            if [ "$IS_PRIVATE" = "true" ]; then
              echo "Skipping private package: $PKG_NAME"
              continue
            fi

            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "Skipping already published package: ${PKG_NAME}@${PKG_VERSION}"
              continue
            fi

            echo "Publishing $PKG_NAME..."
            (cd "$pkg" && pnpm publish --access public) || {
              echo "Error: Failed to publish ${PKG_NAME}@${PKG_VERSION}"
              FAILED=1
            }
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more packages failed to publish"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
