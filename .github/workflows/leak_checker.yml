name: Leak Checker

# LEAK_WORDS 是仓库 secret，绝不能暴露给 fork PR 或 pull_request_target 中的第三方代码。
# 仅在 main 合并后使用 secret 扫描；PR 阶段不向任何候选代码暴露敏感词配置。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leak-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Changed Content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Scan pushed commits with repository-owned code
        run: node scripts/check-leak-words.mjs --range "${{ github.event.before }}" "${{ github.sha }}"
