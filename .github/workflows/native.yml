name: Container repair probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Recheck downloads and fixture ownership on Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HAI_TEST_CONTAINER_ENGINE: docker
      HAI_CLI_RUN_GENERATE_GATES: '1'
      HAI_DEPLOY_E2E: '1'
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@h-ai/cli
      - run: pnpm --filter @h-ai/cli exec vitest run tests/build-downloads.e2e.test.ts tests/deploy-fixture-ownership.e2e.test.ts --no-file-parallelism
