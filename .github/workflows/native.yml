name: Native delivery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop-app/**'
      - 'apps/mobile-app/**'
      - 'packages/**'
      - pnpm-lock.yaml
      - .github/workflows/native.yml

permissions:
  contents: read

jobs:
  package:
    name: Native package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-java@v5.7.0
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build framework dependencies
        run: pnpm exec turbo run build --filter=desktop-app^... --filter=mobile-app^...
      - name: Package Windows NSIS installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          rustup show
          pnpm --filter desktop-app build --target desktop --platform windows --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Android debug APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          pnpm --filter mobile-app build
          pnpm --filter mobile-app exec cap add android
          pnpm --filter mobile-app exec cap sync android
          cd apps/mobile-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Package iOS simulator app
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          xcodebuild -version
          pnpm --filter mobile-app build
          pnpm --filter mobile-app exec cap add ios --packagemanager SPM
          pnpm --filter mobile-app exec cap sync ios
          xcodebuild -project apps/mobile-app/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .cache/native/ios CODE_SIGNING_ALLOWED=NO build
      - name: Record acceptance boundary
        if: always()
        shell: bash
        run: |
          mkdir -p .cache/native
          printf 'commit=%s\nplatform=%s\nrun=%s\npackage_status=%s\ninstall_launch_auth_storage_network_upgrade=UNVERIFIED\n' '${{ github.sha }}' '${{ matrix.platform }}' '${{ github.run_id }}' '${{ job.status }}' > .cache/native/result.txt
      - uses: actions/upload-artifact@v6.0.0
        if: always()
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            .cache/native/result.txt
            apps/desktop-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            apps/mobile-app/android/app/build/outputs/apk/debug/*.apk
            .cache/native/ios/Build/Products/Debug-iphonesimulator/App.app
