name: Nginx capacity probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Check encrypted capacities on Docker and Nginx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HAI_TEST_CONTAINER_ENGINE: docker
      HAI_DEPLOY_E2E: '1'
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@h-ai/cli --filter=@h-ai/serv
      - run: pnpm --filter @h-ai/cli exec vitest run tests/deploy-nginx.e2e.test.ts
