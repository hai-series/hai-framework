name: Native delivery
run-name: SDK SSH diagnostics (${{ github.ref_name }})

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK SSH fixture diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      HAI_TEST_CONTAINER_ENGINE: docker
      HAI_DEPLOY_E2E: '1'
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK dependencies
        run: pnpm exec turbo run build --filter=@h-ai/deploy
      - name: Verify real SSH fixture
        run: pnpm --filter @h-ai/deploy exec vitest run tests/deploy-command-runtime.e2e.test.ts --no-file-parallelism
