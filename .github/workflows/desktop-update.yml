name: Desktop update package

on:
  workflow_dispatch:
    inputs:
      platform:
        description: x64 installer platform
        type: choice
        default: linux
        options:
          - linux
          - windows
      feed_url:
        description: HTTPS URL ending in /latest.json
        required: true
        type: string
      asset_base_url:
        description: HTTPS directory for this version's installer
        required: true
        type: string
      release_notes:
        description: Update description shown in the app
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || 'windows-latest' }}
    timeout-minutes: 60
    environment: desktop-update
    env:
      PNPM_COMMAND: ${{ inputs.platform == 'windows' && 'pnpm.cmd' || 'pnpm' }}
      TAURI_UPDATE_PLATFORM: ${{ inputs.platform }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install Linux Tauri dependencies
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libfuse2t64
      - run: '& $env:PNPM_COMMAND install --frozen-lockfile'
      - name: Build framework dependencies
        run: '& $env:PNPM_COMMAND exec turbo run build --filter=desktop-app^...'
      - name: Configure app update source
        env:
          TAURI_UPDATE_FEED_URL: ${{ inputs.feed_url }}
          TAURI_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATE_PUBLIC_KEY }}
        run: node scripts/desktop-update-release.mjs configure "apps/desktop-app/src-tauri/tauri.${env:TAURI_UPDATE_PLATFORM}.conf.json" "$env:TAURI_UPDATE_FEED_URL"
      - name: Build the x64 installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ inputs.platform == 'linux' && '1' || '' }}
        run: '& $env:PNPM_COMMAND --filter desktop-app build --target desktop --platform "$env:TAURI_UPDATE_PLATFORM" --arch x64'
      - name: Sign the installer and prepare the update feed
        env:
          TAURI_UPDATE_ASSET_BASE_URL: ${{ inputs.asset_base_url }}
          TAURI_UPDATE_NOTES: ${{ inputs.release_notes }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/desktop-update-release.mjs package "$env:TAURI_UPDATE_PLATFORM" apps/desktop-app "$env:TAURI_UPDATE_ASSET_BASE_URL" .cache/native/desktop-update
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: desktop-update-${{ inputs.platform }}-x64-${{ github.sha }}
          path: .cache/native/desktop-update/*
          if-no-files-found: error
          include-hidden-files: true
