name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck, Lint, Build, Test and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
    outputs:
      version_changed: ${{ steps.check_version.outputs.changed }}
      version: ${{ steps.check_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release tag existence
        if: github.event_name == 'push'
        id: check_version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          VERSION_TAG="v${CURRENT}"

          echo "Current version: $CURRENT"
          echo "Checking tags: ${VERSION_TAG} (and fallback: ${CURRENT})"

          if git rev-parse "${VERSION_TAG}" >/dev/null 2>&1 || git rev-parse "${CURRENT}" >/dev/null 2>&1; then
            echo "Tag for current version already exists, skip release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No tag found for current version, trigger release after quality checks"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: pnpm --filter admin-console exec playwright install --with-deps chrome

      - name: Example and scaffold E2E
        run: pnpm e2e

      - name: Pack verified build artifacts
        if: steps.check_version.outputs.changed == 'true'
        run: tar -czf build-artifacts.tgz packages/*/dist

      - name: Upload verified build artifacts
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ steps.check_version.outputs.version }}
          path: build-artifacts.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: quality
    if: needs.quality.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ needs.quality.outputs.version }}
          path: ${{ runner.temp }}/release-build

      - name: Restore verified build artifacts
        run: tar -xzf "${{ runner.temp }}/release-build/build-artifacts.tgz"

      - name: Sync versions
        run: node scripts/sync-versions.mjs

      - name: Commit version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: sync version to v${{ needs.quality.outputs.version }} [skip ci]"
            git push || { echo "Error: push failed, branch may have moved. Re-run release from latest main."; exit 1; }
          fi

      - name: Generate release notes
        run: |
          VERSION="v${{ needs.quality.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          CONTRIBUTORS_URL="${REPO_URL}/graphs/contributors"

          # 按提交历史查找当前提交之前的最近发布 tag，避免预发布版本按字符串排序失真。
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            COMPARE_SECTION=""
          else
            RANGE="${PREV_TAG}..HEAD"
            COMPARE_SECTION="## 🔍 Full Changelog\n- [${PREV_TAG}...${VERSION}](${REPO_URL}/compare/${PREV_TAG}...${VERSION})\n\n"
          fi

          FEATURES=""
          FIXES=""
          REFACTORS=""
          DOCS=""
          PERF=""
          TESTS=""
          CHORES=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG="${line#* }"
            case "$MSG" in
              feat:*|feat\(*) FEATURES="${FEATURES}\n- ${MSG}" ;;
              fix:*|fix\(*) FIXES="${FIXES}\n- ${MSG}" ;;
              refactor:*|refactor\(*) REFACTORS="${REFACTORS}\n- ${MSG}" ;;
              docs:*|docs\(*) DOCS="${DOCS}\n- ${MSG}" ;;
              perf:*|perf\(*) PERF="${PERF}\n- ${MSG}" ;;
              test:*|test\(*) TESTS="${TESTS}\n- ${MSG}" ;;
              chore:*|chore\(*|ci:*|ci\(*|build:*|build\(*) CHORES="${CHORES}\n- ${MSG}" ;;
              *) OTHER="${OTHER}\n- ${MSG}" ;;
            esac
          done <<< "$(git log "$RANGE" --oneline --no-merges 2>/dev/null)"

          NOTES=""
          [ -n "$FEATURES" ] && NOTES="${NOTES}## ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES" ] && NOTES="${NOTES}## 🐛 Bug Fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && NOTES="${NOTES}## ♻️ Refactoring\n${REFACTORS}\n\n"
          [ -n "$PERF" ] && NOTES="${NOTES}## ⚡ Performance\n${PERF}\n\n"
          [ -n "$DOCS" ] && NOTES="${NOTES}## 📖 Documentation\n${DOCS}\n\n"
          [ -n "$TESTS" ] && NOTES="${NOTES}## 🧪 Tests\n${TESTS}\n\n"
          [ -n "$CHORES" ] && NOTES="${NOTES}## 🔧 Chores\n${CHORES}\n\n"
          [ -n "$OTHER" ] && NOTES="${NOTES}## 📦 Other\n${OTHER}\n\n"

          if [ -z "$NOTES" ]; then
            NOTES="Initial release ${VERSION}"
          fi

          NOTES="${NOTES}${COMPARE_SECTION}## 🙌 Contributors\n- [View all contributors](${CONTRIBUTORS_URL})\n\n"
          printf '%b' "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Create tag
        run: |
          VERSION="v${{ needs.quality.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping creation"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION" || echo "Tag $VERSION already pushed to remote"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.quality.outputs.version }}
          name: v${{ needs.quality.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          echo "Publishing public packages to npm..."
          FAILED=0

          for pkg in packages/*/; do
            PKG_JSON="${pkg}package.json"
            if [ ! -f "$PKG_JSON" ]; then
              continue
            fi

            IS_PRIVATE=$(node -p "require('./${PKG_JSON}').private || false")
            PKG_NAME=$(node -p "require('./${PKG_JSON}').name")
            PKG_VERSION=$(node -p "require('./${PKG_JSON}').version")

            if [ "$IS_PRIVATE" = "true" ]; then
              echo "Skipping private package: $PKG_NAME"
              continue
            fi

            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "Skipping already published package: ${PKG_NAME}@${PKG_VERSION}"
              continue
            fi

            echo "Publishing $PKG_NAME..."
            (cd "$pkg" && pnpm publish --access public) || {
              echo "Error: Failed to publish ${PKG_NAME}@${PKG_VERSION}"
              FAILED=1
            }
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more packages failed to publish"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
