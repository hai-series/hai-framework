name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every verification stage without reusing successful results
        default: true
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan validation and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fingerprints: ${{ steps.inputs.outputs.fingerprints }}
      baseline: ${{ steps.inputs.outputs.baseline }}
      base_sha: ${{ steps.inputs.outputs.base_sha }}
      version_changed: ${{ steps.check_version.outputs.changed }}
      version: ${{ steps.check_version.outputs.version }}
      npm_tag: ${{ steps.check_version.outputs.npm_tag }}
      prerelease: ${{ steps.check_version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
      - name: Fingerprint real validation inputs
        id: inputs
        run: node scripts/ci-plan.mjs plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check release completion
        if: github.event_name == 'push'
        id: check_version
        run: node scripts/release-status.mjs status
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    name: Build shared artifacts
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    outputs:
      artifact: ci-build-state-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Restore content-addressed task outputs
        uses: actions/cache@v5.1.0
        with:
          path: .turbo/cache
          key: hai-ci-build-v1-${{ runner.os }}-node24.22.1-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            hai-ci-build-v1-${{ runner.os }}-node24.22.1-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # lint独立运行；Turbo仍按真实^build依赖恢复/构建，不使用失效dist绕过前置。
      - name: Build
        run: pnpm exec turbo run build
      # 提交号不是普通源码输入；官网元数据必须来自本次SHA，不能沿用旧Turbo输出。
      - name: Refresh website build identity
        run: pnpm --filter framework-website build
      - name: Pack build state
        run: tar -czf "$RUNNER_TEMP/build-state.tgz" packages/*/dist .turbo/cache
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: ci-build-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-state.tgz
          if-no-files-found: error
          retention-days: 3
      # 制品先准备，只有最终汇总和完整CI成功后才允许npm/Pages消费。
      - name: Upload documentation website
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: framework-website-${{ github.sha }}
          path: apps/framework-website/build
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 3

      - name: Pack release artifacts
        if: needs.plan.outputs.version_changed == 'true'
        run: tar -czf build-artifacts.tgz packages/*/dist

      - name: Upload release artifacts
        if: needs.plan.outputs.version_changed == 'true'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: release-build-${{ needs.plan.outputs.version }}
          path: build-artifacts.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  lint:
    name: Lint and documentation structure
    needs: plan
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: lint
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints).lint }}
      command: pnpm lint
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      force: ${{ inputs.full == true }}

  typecheck:
    name: Typecheck
    needs: [plan, build]
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: typecheck
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints).typecheck }}
      command: pnpm typecheck
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      build_artifact: ${{ needs.build.outputs.artifact }}
      force: ${{ inputs.full == true }}

  contracts:
    name: Public contracts and configuration
    needs: [plan, build]
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: contracts
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints).contracts }}
      command: pnpm check:env && pnpm check:usage-examples && pnpm check:api && pnpm check:jsdoc && pnpm test:api
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      build_artifact: ${{ needs.build.outputs.artifact }}
      force: ${{ inputs.full == true }}

  unit:
    name: Unit and container tests
    needs: [plan, build]
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: unit
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints).unit }}
      command: pnpm test
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      build_artifact: ${{ needs.build.outputs.artifact }}
      force: ${{ inputs.full == true }}

  scaffold:
    name: CLI scaffold gates
    needs: [plan, build, lint, typecheck, contracts]
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: scaffold
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints).scaffold }}
      command: pnpm --filter @h-ai/cli test:scaffold-gates
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      build_artifact: ${{ needs.build.outputs.artifact }}
      browser: true
      timeout: 60
      force: ${{ inputs.full == true }}

  sdk:
    name: Deployment SDK E2E
    needs: [plan, build, lint, typecheck, contracts]
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: sdk
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints).sdk }}
      command: pnpm --filter @h-ai/deploy test:e2e
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      build_artifact: ${{ needs.build.outputs.artifact }}
      timeout: 45
      force: ${{ inputs.full == true }}

  deploy:
    name: CLI deployment integration E2E
    needs: [plan, build, lint, typecheck, contracts]
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: deploy
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints).deploy }}
      command: pnpm --filter @h-ai/cli test:deploy-gates
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      build_artifact: ${{ needs.build.outputs.artifact }}
      browser: true
      timeout: 75
      force: ${{ inputs.full == true }}

  browsers:
    name: Browser ${{ matrix.app }}
    needs: [plan, build, lint, typecheck, contracts]
    strategy:
      fail-fast: false
      matrix:
        app: [admin-console, ai-playground, corporate-website, h5-app, mobile-app, framework-website]
    uses: ./.github/workflows/ci-stage.yml
    with:
      stage: browser-${{ matrix.app }}
      fingerprint: ${{ fromJSON(needs.plan.outputs.fingerprints)[format('browser-{0}', matrix.app)] }}
      command: pnpm --filter ${{ matrix.app }} test:e2e
      baseline: ${{ needs.plan.outputs.baseline }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      build_artifact: ${{ needs.build.outputs.artifact }}
      browser: true
      force: ${{ inputs.full == true }}

  quality:
    # 保留原必需检查名称，避免已有分支保护因拆分阶段而失去汇总检查。
    name: Typecheck, Lint, Build, Test and E2E
    if: always()
    needs: [plan, build, lint, typecheck, contracts, unit, scaffold, sdk, deploy, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_changed: ${{ needs.plan.outputs.version_changed }}
      version: ${{ needs.plan.outputs.version }}
      npm_tag: ${{ needs.plan.outputs.npm_tag }}
      prerelease: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
      - name: Require every stage to succeed
        run: node scripts/ci-plan.mjs aggregate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

  release:
    name: Release
    needs: quality
    if: needs.quality.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: release-build-${{ needs.quality.outputs.version }}
          path: ${{ runner.temp }}/release-build

      - name: Restore verified build artifacts
        run: tar -xzf "${{ runner.temp }}/release-build/build-artifacts.tgz"

      - name: Sync versions
        run: node scripts/sync-versions.mjs

      - name: Generate release notes
        run: |
          VERSION="v${{ needs.quality.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          CONTRIBUTORS_URL="${REPO_URL}/graphs/contributors"

          # 按提交历史查找当前提交之前的最近发布 tag，避免预发布版本按字符串排序失真。
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            COMPARE_SECTION=""
          else
            RANGE="${PREV_TAG}..HEAD"
            COMPARE_SECTION="## 🔍 Full Changelog\n- [${PREV_TAG}...${VERSION}](${REPO_URL}/compare/${PREV_TAG}...${VERSION})\n\n"
          fi

          FEATURES=""
          FIXES=""
          REFACTORS=""
          DOCS=""
          PERF=""
          TESTS=""
          CHORES=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG="${line#* }"
            case "$MSG" in
              feat:*|feat\(*) FEATURES="${FEATURES}\n- ${MSG}" ;;
              fix:*|fix\(*) FIXES="${FIXES}\n- ${MSG}" ;;
              refactor:*|refactor\(*) REFACTORS="${REFACTORS}\n- ${MSG}" ;;
              docs:*|docs\(*) DOCS="${DOCS}\n- ${MSG}" ;;
              perf:*|perf\(*) PERF="${PERF}\n- ${MSG}" ;;
              test:*|test\(*) TESTS="${TESTS}\n- ${MSG}" ;;
              chore:*|chore\(*|ci:*|ci\(*|build:*|build\(*) CHORES="${CHORES}\n- ${MSG}" ;;
              *) OTHER="${OTHER}\n- ${MSG}" ;;
            esac
          done <<< "$(git log "$RANGE" --oneline --no-merges 2>/dev/null)"

          NOTES=""
          [ -n "$FEATURES" ] && NOTES="${NOTES}## ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES" ] && NOTES="${NOTES}## 🐛 Bug Fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && NOTES="${NOTES}## ♻️ Refactoring\n${REFACTORS}\n\n"
          [ -n "$PERF" ] && NOTES="${NOTES}## ⚡ Performance\n${PERF}\n\n"
          [ -n "$DOCS" ] && NOTES="${NOTES}## 📖 Documentation\n${DOCS}\n\n"
          [ -n "$TESTS" ] && NOTES="${NOTES}## 🧪 Tests\n${TESTS}\n\n"
          [ -n "$CHORES" ] && NOTES="${NOTES}## 🔧 Chores\n${CHORES}\n\n"
          [ -n "$OTHER" ] && NOTES="${NOTES}## 📦 Other\n${OTHER}\n\n"

          if [ -z "$NOTES" ]; then
            NOTES="Initial release ${VERSION}"
          fi

          NOTES="${NOTES}${COMPARE_SECTION}## 🙌 Contributors\n- [View all contributors](${CONTRIBUTORS_URL})\n\n"
          printf '%b' "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify existing tag target
        run: |
          VERSION="v${{ needs.quality.outputs.version }}"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)" || {
              echo "Existing release tag points to a different commit; rerun the original workflow or use a new version."
              exit 1
            }
          fi

      # 首个包发布前绑定版本与本次验证SHA；中途失败只能从同一提交恢复，避免同版混包。
      # tag仅作来源锚点，发布完成仍由全部npm版本和GitHub Release共同判定。
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="v${{ needs.quality.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping creation"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Publish missing npm packages
        run: |
          node scripts/release-status.mjs missing > "$RUNNER_TEMP/missing-packages.txt"
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            (cd "$pkg" && pnpm publish --access public --no-git-checks --tag "$NPM_DIST_TAG")
          done < "$RUNNER_TEMP/missing-packages.txt"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.quality.outputs.npm_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ needs.quality.outputs.version }}
          name: v${{ needs.quality.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ needs.quality.outputs.prerelease == 'true' }}

  sync_versions:
    name: Commit versions after release
    needs: [quality, release]
    if: >-
      always() && github.event_name == 'push' && needs.quality.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24.22.1
      - name: Sync and commit versions
        run: |
          node scripts/sync-versions.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/release-status.mjs commit-sync
