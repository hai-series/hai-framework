name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck, Lint, Build, Test and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      # Testcontainers 的 Ryuk 清理容器在 ephemeral CI runner 上偶发 "Failed to connect to Reaper"，
      # 导致 vecdb/cache 容器化测试随机失败。测试已在 release() 显式 stop 容器，runner 用完即销毁，
      # Ryuk 冗余，禁用即可消除该 flaky 失败。turbo test 任务已 passThroughEnv TESTCONTAINERS_*。
      TESTCONTAINERS_RYUK_DISABLED: true
    outputs:
      version_changed: ${{ steps.check_version.outputs.changed }}
      version: ${{ steps.check_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release completion
        if: github.event_name == 'push'
        id: check_version
        run: node scripts/release-status.mjs status
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: pnpm --filter admin-console exec playwright install --with-deps chrome

      - name: Example and scaffold E2E
        run: pnpm e2e

      - name: Pack verified build artifacts
        if: steps.check_version.outputs.changed == 'true'
        run: tar -czf build-artifacts.tgz packages/*/dist

      - name: Upload verified build artifacts
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ steps.check_version.outputs.version }}
          path: build-artifacts.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: quality
    if: needs.quality.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ needs.quality.outputs.version }}
          path: ${{ runner.temp }}/release-build

      - name: Restore verified build artifacts
        run: tar -xzf "${{ runner.temp }}/release-build/build-artifacts.tgz"

      - name: Sync versions
        run: node scripts/sync-versions.mjs

      - name: Generate release notes
        run: |
          VERSION="v${{ needs.quality.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          CONTRIBUTORS_URL="${REPO_URL}/graphs/contributors"

          # 按提交历史查找当前提交之前的最近发布 tag，避免预发布版本按字符串排序失真。
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            COMPARE_SECTION=""
          else
            RANGE="${PREV_TAG}..HEAD"
            COMPARE_SECTION="## 🔍 Full Changelog\n- [${PREV_TAG}...${VERSION}](${REPO_URL}/compare/${PREV_TAG}...${VERSION})\n\n"
          fi

          FEATURES=""
          FIXES=""
          REFACTORS=""
          DOCS=""
          PERF=""
          TESTS=""
          CHORES=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG="${line#* }"
            case "$MSG" in
              feat:*|feat\(*) FEATURES="${FEATURES}\n- ${MSG}" ;;
              fix:*|fix\(*) FIXES="${FIXES}\n- ${MSG}" ;;
              refactor:*|refactor\(*) REFACTORS="${REFACTORS}\n- ${MSG}" ;;
              docs:*|docs\(*) DOCS="${DOCS}\n- ${MSG}" ;;
              perf:*|perf\(*) PERF="${PERF}\n- ${MSG}" ;;
              test:*|test\(*) TESTS="${TESTS}\n- ${MSG}" ;;
              chore:*|chore\(*|ci:*|ci\(*|build:*|build\(*) CHORES="${CHORES}\n- ${MSG}" ;;
              *) OTHER="${OTHER}\n- ${MSG}" ;;
            esac
          done <<< "$(git log "$RANGE" --oneline --no-merges 2>/dev/null)"

          NOTES=""
          [ -n "$FEATURES" ] && NOTES="${NOTES}## ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES" ] && NOTES="${NOTES}## 🐛 Bug Fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && NOTES="${NOTES}## ♻️ Refactoring\n${REFACTORS}\n\n"
          [ -n "$PERF" ] && NOTES="${NOTES}## ⚡ Performance\n${PERF}\n\n"
          [ -n "$DOCS" ] && NOTES="${NOTES}## 📖 Documentation\n${DOCS}\n\n"
          [ -n "$TESTS" ] && NOTES="${NOTES}## 🧪 Tests\n${TESTS}\n\n"
          [ -n "$CHORES" ] && NOTES="${NOTES}## 🔧 Chores\n${CHORES}\n\n"
          [ -n "$OTHER" ] && NOTES="${NOTES}## 📦 Other\n${OTHER}\n\n"

          if [ -z "$NOTES" ]; then
            NOTES="Initial release ${VERSION}"
          fi

          NOTES="${NOTES}${COMPARE_SECTION}## 🙌 Contributors\n- [View all contributors](${CONTRIBUTORS_URL})\n\n"
          printf '%b' "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify existing tag target
        run: |
          VERSION="v${{ needs.quality.outputs.version }}"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)" || {
              echo "Existing release tag points to a different commit; rerun the original workflow or use a new version."
              exit 1
            }
          fi

      - name: Publish missing npm packages
        run: |
          node scripts/release-status.mjs missing > "$RUNNER_TEMP/missing-packages.txt"
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            (cd "$pkg" && pnpm publish --access public --no-git-checks)
          done < "$RUNNER_TEMP/missing-packages.txt"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="v${{ needs.quality.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping creation"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.quality.outputs.version }}
          name: v${{ needs.quality.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false

  sync_versions:
    name: Commit versions after release
    needs: [quality, release]
    if: >-
      always() && github.event_name == 'push' && needs.quality.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Sync and commit versions
        run: |
          node scripts/sync-versions.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/release-status.mjs commit-sync
